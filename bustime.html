<style>
/* Layout: glass top bar, then a left control panel (search, routes, stops, favourites, admin) beside a real Leaflet map of Bangkok; stacks map-over-panel on phones. */
:root{
  --bg:#0A0A0A; --navy:#141414; --navy-2:#1F1F1F;
  --sky:#38BDF8; --sky-2:#0EA5E9; --text:#F8FAFC; --muted:#94A3B8;
  --line:rgba(148,163,184,.16); --glass:rgba(20,20,20,.72); --glass-2:rgba(31,31,31,.6);
  --deep:10,10,10; --pop:20,20,20; --mapbg:#17263C; --shadow:rgba(0,0,0,.4); --glow:rgba(56,189,248,.10);
  --dist-stroke:#3A4659; --dist-bkk:none; --dist-ring:none; --dist-lbl:#8793A6; --dist-halo:#242F3E;
  --bm-land:#242F3E;--bm-nb:#1E2836;--bm-edge:#3A4659;--bm-water:#17263C;--bm-park:#263E3A;--bm-hw:#746855;--bm-hwc:#2E2819;--bm-rd:#38414E;--bm-rdc:#1B2330;--bm-mn:#2F3846;
  --bm-lbl:#9AA6B8;--bm-lbl2:#8793A6;--bm-halo:#242F3E;--bm-wlbl:#6C95C9;--bm-plbl:#6FB48A;
  --on-sky:#04111C;
  --ok:#34D399; --warn:#FBBF24; --bad:#FB7185;
  --t-hot:#FBBF24; --t-ac:#38BDF8; --t-ev:#34D399; --t-exp:#A78BFA;
  --font:'Noto Sans','Noto Sans Thai',system-ui,'Leelawadee UI',Tahoma,sans-serif;   /* Google Noto Sans ทั้งระบบ (Noto Sans ไม่มีอักษรไทย → ใช้ Noto Sans Thai คู่กัน) */
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F8FAFC; --navy:#F1F5F9; --navy-2:#E2E8F0;
  --sky:#0284C7; --sky-2:#0369A1; --text:#0F172A; --muted:#475569;
  --line:rgba(15,23,42,.13); --glass:rgba(255,255,255,.80); --glass-2:rgba(241,245,249,.88);
  --deep:241,245,249; --pop:255,255,255; --mapbg:#AADAFF; --shadow:rgba(15,23,42,.14); --glow:rgba(2,132,199,.06);
  --dist-stroke:#D3D7DC; --dist-bkk:none; --dist-ring:none; --dist-lbl:#80868B; --dist-halo:#ffffff;
  --bm-land:#F8F9FA;--bm-nb:#EDEFF1;--bm-edge:#CDD2D8;--bm-water:#AADAFF;--bm-park:#CEEAD6;--bm-hw:#FCD34D;--bm-hwc:#F59E0B;--bm-rd:#FFFFFF;--bm-rdc:#DADCE0;--bm-mn:#FFFFFF;
  --bm-lbl:#5F6368;--bm-lbl2:#80868B;--bm-halo:#FFFFFF;--bm-wlbl:#4A7FB5;--bm-plbl:#188038;
  --on-sky:#ffffff;
  --ok:#059669; --warn:#B45309; --bad:#E11D48;
  --t-hot:#F59E0B; --t-ac:#0EA5E9; --t-ev:#10B981; --t-exp:#8B5CF6;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font:14px/1.5 var(--font);color:var(--text);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 520px at 88% -8%,rgba(14,165,233,.17),transparent 60%),radial-gradient(760px 520px at -6% 108%,rgba(56,189,248,.09),transparent 60%),var(--bg);
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(56,189,248,.35)}
*{scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.3) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.5)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#root{height:100%}

.shell{height:100%;display:flex;flex-direction:column;gap:12px;min-height:0;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 10px 40px var(--shadow),0 0 0 1px var(--glow),inset 0 0 26px var(--glow)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-name{font-weight:700;font-size:20px;letter-spacing:.14em;line-height:1}
.brand-name b{color:var(--sky);font-weight:700}
.brand-sub{font-size:12px;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass-2);font-size:12.5px;color:var(--muted);white-space:nowrap;transition:border-color .2s,color .2s,background .2s}
button.chip:hover{border-color:rgba(56,189,248,.5);color:var(--text)}
.chip.on{color:var(--sky);border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
.chip.admin{color:var(--on-sky);background:var(--sky);border-color:var(--sky);font-weight:600}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);position:relative;flex:none}
.live-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--ok);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(.4);opacity:.9}to{transform:scale(1.6);opacity:0}}

/* main grid */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,430px) minmax(0,1fr);gap:12px}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel-head{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.panel-body{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}
.panel-body>*{flex:none}
.map-card{position:relative;min-height:0;min-width:0;overflow:hidden}
@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(230px,38%) minmax(0,1fr)}
  .map-card{order:-1}
  .brand-sub{display:none}
}

/* tabs / search / chips */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:rgba(var(--deep),.55);border:1px solid var(--line);border-radius:14px}
.tab{display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:10px;color:var(--muted);font-size:13px;font-weight:500;transition:background .2s,color .2s;min-width:0}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs.mnav{gap:2px;padding:3px;grid-auto-flow:row;grid-template-columns:repeat(7,minmax(0,1fr))}
.tabs.mnav .tab{flex-direction:column;gap:1px;height:46px;font-size:11px;padding:0 1px;line-height:1.15}
.tabs.mnav .tab svg{flex:none}
.tab:hover{color:var(--text)}
.tab.on{background:rgba(56,189,248,.14);color:var(--sky)}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:14px;background:rgba(var(--deep),.55);border:1px solid var(--line);color:var(--muted);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:rgba(56,189,248,.6);box-shadow:0 0 0 3px rgba(56,189,248,.14)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text)}
.search input::placeholder{color:#64748B}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips .chip{height:28px;font-size:12.5px;flex:none}
select.sel{height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(var(--deep),.55);padding:0 10px;color:var(--text);min-width:0;max-width:100%}
select.sel option{background:var(--navy)}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);text-align:left;width:100%;min-width:0;transition:transform .18s,border-color .2s,background .2s}
.row:hover{border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.07);transform:translateY(-1px)}
.row .mid{flex:1;min-width:0}
.row .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rno{flex:none;min-width:52px;height:38px;padding:0 8px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:16px;color:#07090E;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.fare{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600;font-size:13px;white-space:nowrap}
.star{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none;transition:color .2s,background .2s}
.star:hover{background:rgba(148,163,184,.12);color:var(--text)}
.star.on{color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:rgba(56,189,248,.1);color:var(--sky);border:1px solid rgba(56,189,248,.25);white-space:nowrap}
.mini{display:inline-grid;place-items:center;min-width:28px;height:18px;padding:0 5px;border-radius:6px;font-size:11px;font-weight:700;color:#07090E;font-variant-numeric:tabular-nums}
.minis{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;height:30px;padding-right:8px;align-self:flex-start}
.back:hover{color:var(--sky)}

/* ETA */
.eta{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.eta .n{font-size:26px;font-weight:700;line-height:1;color:var(--sky)}
.eta .u{font-size:12px;color:var(--muted)}
.eta.now .n{font-size:14px;color:var(--ok);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.crowd{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.crowd i{width:8px;height:8px;border-radius:50%;display:inline-block}
.arr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2)}
.arr .dest{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr .l2{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:2px}
.bell{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.bell:hover{color:var(--text);border-color:rgba(56,189,248,.5)}
.bell.on{color:var(--on-sky);background:var(--sky);border-color:var(--sky)}

/* detail */
.dh{display:flex;gap:12px;align-items:center;min-width:0}
.dh h2{margin:0;font-size:17px;line-height:1.3;font-weight:700}
.dh .sub{color:var(--muted);font-size:12.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:rgba(var(--deep),.55);border:1px solid var(--line);border-radius:14px}
.seg button{padding:7px 10px;border-radius:10px;color:var(--muted);font-size:12.5px;text-align:left;min-width:0;line-height:1.3}
.seg button b{display:block;color:inherit;font-size:13px}
.seg button span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.seg button.on{background:rgba(56,189,248,.14);color:var(--sky)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:10px 12px;border-radius:14px;background:var(--glass-2);border:1px solid var(--line)}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}
.busrail{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.buscard{flex:none;width:176px;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);transition:border-color .2s,background .2s}
.buscard:hover,.buscard.on{border-color:rgba(56,189,248,.6);background:rgba(56,189,248,.09)}
.buscard .c{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.buscard .m{font-size:12px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;display:flex;align-items:center;gap:12px;padding:0 0 0 28px;min-height:50px}
.tl li::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;background:rgba(56,189,248,.35)}
.tl li:first-child::before{top:50%}
.tl li:last-child::before{bottom:50%}
.tl li .dot{position:absolute;left:3px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg);border:3px solid var(--sky)}
.tl li.term .dot{background:var(--sky)}
.tl li.focus .dot{box-shadow:0 0 0 4px rgba(56,189,248,.25)}
.tl .nm{flex:1;min-width:0;text-align:left;padding:8px 0}
.tl .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .nm small{color:var(--muted);font-size:11.5px}
.tl .te{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--sky);white-space:nowrap}
.tl .te.now{color:var(--ok)}

/* buttons / forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass-2);font-weight:500;font-size:13.5px;transition:transform .15s,border-color .2s,background .2s,opacity .2s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:rgba(56,189,248,.55);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--sky),var(--sky-2));color:var(--on-sky);border-color:transparent;font-weight:700}
.btn.danger{color:var(--bad);border-color:rgba(251,113,133,.4)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:10px}
.btn.wide{width:100%}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(var(--deep),.6);padding:0 10px;min-width:0;width:100%;outline:0;transition:border-color .2s,box-shadow .2s}
.field textarea{height:auto;padding:8px 10px;min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(56,189,248,.6);box-shadow:0 0 0 3px rgba(56,189,248,.14)}
.field select option{background:var(--navy)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.form{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:16px;border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.05)}
.err{color:var(--bad);font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--deep),.45)}
.note.warn{border-color:rgba(251,191,36,.35);color:#FDE68A}
.stoplist{display:flex;flex-direction:column;gap:6px}
.stoplist .it{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:10px;background:rgba(var(--deep),.5);border:1px solid var(--line)}
.stoplist .it span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icbtn{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.icbtn:hover:not(:disabled){background:rgba(148,163,184,.14);color:var(--text)}
.icbtn:disabled{opacity:.3}
pre.code{margin:0;padding:10px 12px;border-radius:12px;background:rgba(2,6,12,.8);border:1px solid var(--line);font:12px/1.5 var(--font);color:#BAE6FD;overflow:auto;max-height:180px;white-space:pre-wrap;word-break:break-all}
.syscard{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);display:flex;flex-direction:column;gap:8px}
.syscard h4{margin:0;font-size:14px}
.syscard p{margin:0;color:var(--muted);font-size:12.5px}
.logline{font:12px/1.5 var(--font);color:var(--muted);display:flex;gap:8px}
.logline.bad{color:var(--bad)}

/* map (Leaflet) */
.map-wrap{position:absolute;inset:0;background:var(--mapbg)}
.lf-map{position:absolute;inset:0;z-index:0;background:var(--mapbg);font-family:var(--font);outline:0}
.map-wrap.picking .lf-map,.map-wrap.picking .lf-map .leaflet-interactive,.map-wrap.picking .lf-map.leaflet-grab{cursor:crosshair}
.hud{position:absolute;z-index:3;pointer-events:none}
.hud > *{pointer-events:auto}
.hud.tl{top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 80px)}
.hud.tr{top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.hud.bl{left:12px;bottom:30px;right:58px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
.hud.bl > *{pointer-events:auto}
.zbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--text);transition:border-color .2s,color .2s}
.zbtn:hover{border-color:rgba(56,189,248,.6);color:var(--sky)}
.buscardmap{padding:12px 14px;border-radius:16px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:6px}
.buscardmap .r1{display:flex;align-items:center;gap:10px}
.buscardmap .r2{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pickbar{padding:8px 12px;border-radius:12px;background:var(--sky);color:var(--on-sky);font-weight:600;font-size:13px;display:flex;align-items:center;gap:10px}
.pickbar button{height:26px;padding:0 10px;border-radius:8px;background:rgba(4,17,28,.15);font-weight:600}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:6px 10px;border-radius:10px;background:var(--glass);border:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.map-note{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:4;padding:8px 14px;border-radius:12px;background:rgba(var(--pop),.94);border:1px solid rgba(251,191,36,.55);font-size:12.5px;max-width:calc(100% - 100px);text-align:center}
@media (max-width:900px){.legend span:nth-child(n+2){display:none}.map-note{top:46px;font-size:11px;padding:5px 8px;max-width:calc(100% - 64px)}.map-note .long{display:none}.mstat{display:none}.hud.bl{bottom:26px}.buscardmap{padding:10px 12px}}
.legend span.keep{display:inline-flex}
.mstat{display:flex;align-items:center;gap:5px;justify-content:center;font-size:10px;color:var(--muted);padding:3px 6px;border-radius:8px;background:var(--glass);border:1px solid var(--line)}
.mstat i{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.mstat.ok i{background:var(--ok)}
.leaflet-tile-pane{transition:filter .4s ease}
.leaflet-tile-pane.tp-invert{filter:invert(1) hue-rotate(180deg) brightness(.86) contrast(.92) saturate(.7)}
.dist{stroke:var(--dist-stroke);stroke-width:1;stroke-dasharray:5 4;fill-opacity:1;stroke-linejoin:round}
.lf-map:not(.z10) path.dist{display:none}
.dist.bkk{fill:var(--dist-bkk)}
.dist.ring{fill:var(--dist-ring)}
.distlbl{background:none;border:0;display:none}
.zhi .distlbl{display:block}
.distlbl span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:500 10.5px/1 var(--font);color:var(--dist-lbl);text-shadow:0 0 3px var(--dist-halo),0 0 3px var(--dist-halo)}
.map-note.big{top:50%;transform:translate(-50%,-50%);font-size:14px}

/* Leaflet theme */
.leaflet-container{font:inherit;background:var(--mapbg)}
.leaflet-container .leaflet-control-attribution{background:rgba(var(--deep),.72);color:var(--muted);font-size:10.5px;border-radius:8px 0 0 0}
.leaflet-container .leaflet-control-attribution a{color:var(--sky)}
.leaflet-container .leaflet-control-scale-line{background:rgba(var(--deep),.6);color:var(--muted);border-color:var(--muted);font-size:10.5px;text-shadow:none}
.bt-popup .leaflet-popup-content-wrapper{background:rgba(var(--pop),.97);color:var(--text);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 36px var(--shadow)}
.bt-popup .leaflet-popup-tip{background:rgba(var(--pop),.97);border:1px solid var(--line)}
.bt-popup .leaflet-popup-content{margin:12px 14px;font:13px/1.45 var(--font)}
.bt-popup a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-tooltip.bt-tip{background:rgba(var(--deep),.86);color:var(--text);border:1px solid var(--line);border-radius:8px;font:500 11.5px/1.3 var(--font);box-shadow:none;padding:2px 7px}
.leaflet-tooltip.bt-tip::before{display:none}
.bt-pop .pn{display:block;font-size:15px;font-weight:600;padding-right:14px}
.bt-pop .ps{color:var(--muted);font-size:12px}
.bt-pop .ptags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bt-pop .ptag{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid rgba(56,189,248,.4);color:var(--sky)}
.bt-pop .plab{margin-top:8px;font-size:11.5px;color:var(--muted)}
.bt-pop .pr{display:inline-block;min-width:30px;text-align:center;padding:1px 7px;border-radius:7px;color:#04111C;font-weight:700;font-size:12px;margin:3px 4px 0 0}
.bt-pop .pnext{margin-top:8px;font-size:12.5px;color:var(--sky);font-weight:600}
.bt-pop .pbtn{margin-top:10px;width:100%;height:32px;border-radius:10px;background:var(--sky);color:var(--on-sky);font-weight:600}
.bt-pop .pbtn:hover{background:#7DD3FC}

/* เส้นทาง / ป้าย / รถ บนแผนที่จริง */
.rt{fill:none;stroke-linecap:round;stroke-linejoin:round}
.rt.base{stroke-width:2}
.rt.glow{stroke:var(--sky);stroke-width:12;opacity:.22}
.rt.main{stroke:var(--sky);stroke-width:4.5}
.rt.flow{stroke:#E0F2FE;stroke-width:2;stroke-dasharray:1 16;animation:flow 1.2s linear infinite}
.rt.flow.rev{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-17}}
path.stopm{fill:var(--bg);stroke:var(--sky);stroke-width:2.5;cursor:pointer;transition:stroke .2s}
path.stopm:hover{stroke:var(--text)}
path.stopm.term{fill:var(--sky)}
path.stopm.small{stroke-width:1.5;stroke:rgba(148,163,184,.9)}
path.stoph{fill:rgba(56,189,248,.22);stroke:var(--sky);stroke-width:1}
.busm{background:none;border:0;cursor:pointer;transition:transform 1s linear}
.leaflet-zoom-anim .busm{transition:transform .25s cubic-bezier(0,0,.25,1)}
.busm .body{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--sky);border:2px solid var(--bg);display:grid;place-items:center;font:700 10px/1 var(--font);color:#04111C;box-shadow:0 2px 8px rgba(0,0,0,.55)}
.busm .ripple{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--sky);pointer-events:none;animation:ripple 2.4s ease-out infinite}
.busm.off .ripple{display:none}
.busm.off .body{background:#475569;color:#E2E8F0}
.busm.sel .body{background:#fff}
:root[data-theme="light"] .busm.sel .body{background:#0F172A;color:#fff}
.busm .crowd{position:absolute;right:0;top:0;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--bg)}
.busm .bdot{display:block;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
@keyframes ripple{from{transform:scale(.7);opacity:.9}to{transform:scale(2.3);opacity:0}}
.meic{background:none;border:0}
.mep{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:rgba(56,189,248,.3);animation:ripple 2s ease-out infinite}
.med{position:absolute;left:8px;top:8px;width:14px;height:14px;border-radius:50%;background:#F8FAFC;border:3px solid var(--sky-2);box-sizing:border-box}
.dpin{background:none;border:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}


/* toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:50;align-items:center;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;width:100%;padding:11px 14px;border-radius:14px;background:rgba(var(--pop),.94);border:1px solid rgba(56,189,248,.45);box-shadow:0 12px 36px var(--shadow);animation:tin .28s ease-out;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.toast.bad{border-color:rgba(251,113,133,.55)}
.toast.ok{border-color:rgba(52,211,153,.5)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.logo-ring{transform-origin:20px 20px;animation:ping2 2.6s ease-out infinite}
@keyframes ping2{from{transform:scale(.55);opacity:.9}to{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== รถไฟฟ้า / ตัววางแผน / ธีม ===== */
path.rl.case{stroke:var(--bg);stroke-opacity:.9}
path.stn{cursor:pointer;transition:stroke-width .15s}
path.stn:hover{stroke-width:4.5}
path.pl.case{stroke:var(--bg);stroke-opacity:.92}
.planning path.rl{stroke-opacity:.18!important}
.planning path.stn{opacity:.4}
.planning path.rt.base{stroke-opacity:.1!important}
.plpin{background:none;border:0}
.plpin b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--text);color:var(--bg);font:700 13px/1 var(--font);border:2px solid var(--sky);box-shadow:0 2px 8px var(--shadow)}
.bt-pop .pr.ln{white-space:nowrap;padding:1px 8px}
.bt-pop .pnote{font-size:10.5px;margin-top:6px}
.bt-pop .prow{display:flex;gap:6px;margin-top:10px}
.bt-pop .prow .pbtn{margin:0;flex:1;height:30px;font-size:12px}
.bt-pop .pnext{margin-top:5px;font-weight:500;color:var(--text)}
.bt-pop .pnext .dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.theme{display:inline-flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--glass-2)}
.theme button{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;color:var(--muted);transition:background .2s,color .2s}
.theme button:hover{color:var(--text)}
.theme button.on{background:var(--sky);color:var(--on-sky);font-weight:600}
.layers{display:flex;gap:6px}
.layers .chip{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:var(--glass)}
.rlegend{display:flex;gap:5px;flex-wrap:wrap;max-width:100%;padding:6px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
@media (max-width:900px){.hud.tl{max-width:calc(100% - 56px)}.layers .chip{height:26px;padding:0 9px;font-size:12px}.rlegend{display:none}.theme button span{display:none}.theme button{padding:0 9px}}
.lchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;color:var(--text);background:var(--glass-2);white-space:nowrap}
.lchip i{width:10px;height:10px;border-radius:50%;background:var(--lc);flex:none}
.lchip:hover,.lchip.on{border-color:var(--lc);background:var(--glass)}
.ltag{display:inline-flex;align-items:center;height:19px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 0;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);width:100%;text-align:left;overflow:hidden;transition:transform .15s,border-color .2s}
.lrow:hover{border-color:var(--lc);transform:translateY(-1px)}
.lrow .bar{align-self:stretch;width:8px;background:var(--lc);flex:none}
.lrow .mid{flex:1;min-width:0}
.lrow .t1{font-weight:600}
.lrow .t2{font-size:12.5px;color:var(--muted)}
.rtl{list-style:none;margin:0;padding:0}
.rtl li{position:relative}

async function fetchRoadFrom(base,stops){

  const tm=setTimeout(()=>{if(ctl)ctl.abort();},15000);
  try{
    const url=base+stops.map(s=>s.lon.toFixed(5)+','+s.lat.toFixed(5)).join(';')+'?overview=full&geometries=geojson&steps=false';
    const res=await fetch(url,ctl?{signal:ctl.signal}:undefined);
    if(!res.ok)return null;
    const j=await res.json();
    const cs=j&&j.code==='Ok'&&j.routes&&j.routes[0]&&j.routes[0].geometry&&j.routes[0].geometry.coordinates;
    if(!cs||cs.length<2)return null;
    const out=[];let lx=-1e9,ly=-1e9,road=0,px=null;
    cs.forEach((c,i)=>{
      const p=proj(c[1],c[0]);
      if(px)road+=Math.hypot(p.x-px.x,p.y-px.y);
      px=p;
      if(i===0||i===cs.length-1||Math.hypot(p.x-lx,p.y-ly)>0.008){out.push(+c[1].toFixed(5),+c[0].toFixed(5));lx=p.x;ly=p.y;}
    });
    let direct=0;
    for(let i=1;i<stops.length;i++){const a=proj(stops[i-1].lat,stops[i-1].lon),b=proj(stops[i].lat,stops[i].lon);direct+=Math.hypot(a.x-b.x,a.y-b.y);}
    if(road>direct*3.5+1)return null;   // เส้นทางอ้อมผิดปกติ: ไม่เชื่อถือ
    return out;
  }catch(e){return null;}
  finally{clearTimeout(tm);}
}
async function fetchRoad(stops){
  for(const base of OSRM_URLS){const r=await fetchRoadFrom(base,stops);if(r)return r;}   // ตัวแรกล้มเหลว → ลองตัวสำรอง
  return null;
}
function useRoads(data,online){
  const [roads,setRoads]=useState(()=>store.get(ROAD_KEY,{}));
  const [tick,setTick]=useState(0);
  useEffect(()=>{
    if(!online||typeof fetch!=='function')return;   // ค่าเริ่มต้น: ไม่เรียกบริการภายนอกเลย (ใช้เส้นที่แคชไว้/ต่อตรงระหว่างป้าย)
    let dead=false;
    const sb={};data.stops.forEach(s=>{sb[s.id]=s;});
    const jobs=[],need={};
    data.routes.forEach(r=>{
      const ids=r.stops.filter(id=>sb[id]);if(ids.length<2)return;
      const sig=roadSig(ids,sb);need[sig]=1;
      if(!roads[sig]&&!roadFail[sig])jobs.push({sig:sig,ids:ids});
    });
    if(!jobs.length)return;
    (async()=>{
      for(const j of jobs){
        if(dead)return;
        const flat=await fetchRoad(j.ids.map(id=>sb[id]));
        if(dead)return;
        if(flat)setRoads(prev=>{const n={};Object.keys(prev).forEach(k=>{if(need[k])n[k]=prev[k];});n[j.sig]=flat;store.set(ROAD_KEY,n);return n;});
        else roadFail[j.sig]=1;
        await new Promise(res=>setTimeout(res,350));
      }
    })();
    return()=>{dead=true;};
  },[data,tick,online]);
  return [roads,()=>{Object.keys(roadFail).forEach(k=>{delete roadFail[k];});setTick(t=>t+1);}];
}

function buildNet(data,roads){
  const stopsById={};
  data.stops.forEach(s=>{const dd=districtOf(s.lat,s.lon);stopsById[s.id]=Object.assign({},s,proj(s.lat,s.lon),{district:dd?dd.n:'',districtLabel:distLabel(dd),zone:((dd&&dd.p===P_BKK&&THON_DISTRICTS.indexOf(dd.n)>=0)||s.province===P_NPT)?'ฝั่งธนบุรี ธนบุรี':''});});
  const routes=[],routesByStop={};
  data.routes.forEach(r=>{
    const ids=r.stops.filter(id=>stopsById[id]);
    if(ids.length<2)return;
    const type=TYPES[r.type]?r.type:'ac';
    const v0=TYPES[type].speed/3600;
    const flat=roads&&roads[roadSig(ids,stopsById)];
    const road=flat&&flat.length>=4?(()=>{const a=[];for(let i=0;i<flat.length;i+=2)a.push([flat[i],flat[i+1]]);return a;})():null;
    // g = เส้นทางหนึ่งทิศ: pp/pc/ll = จุด/ระยะสะสม/พิกัดของเส้นทางจริง, cum = ระยะสะสม ณ แต่ละป้าย (เรียงตามเส้นทาง)
    const mk=(arr,ll)=>{
      const line=ll||arr.map(id=>[stopsById[id].lat,stopsById[id].lon]);
      const pp=line.map(q=>proj(q[0],q[1]));
      const pc=[0];
      for(let i=1;i<pp.length;i++)pc.push(pc[i-1]+Math.hypot(pp[i].x-pp[i-1].x,pp[i].y-pp[i-1].y));
      if(pc[pc.length-1]<0.05)pc[pc.length-1]=0.05;
      const cum=[];let j=0;
      arr.forEach((id,k)=>{
        if(k===0){cum.push(0);return;}
        if(k===arr.length-1){cum.push(pc[pc.length-1]);return;}
        const s=stopsById[id];let hit=-1,best=j,bd=1e9;
        for(let i=j;i<pp.length;i++){
          const d=Math.hypot(pp[i].x-s.x,pp[i].y-s.y);
          if(d<bd){bd=d;best=i;}
          if(hit<0&&d<0.06)hit=i;            // จุดแรกบนเส้นทางที่ใกล้ป้าย (<60 ม.) หลังป้ายก่อนหน้า
        }
        j=hit>=0?hit:best;cum.push(pc[j]);
      });
      return {ids:arr,pp:pp,pc:pc,ll:line,cum:cum,L:pc[pc.length-1]};
    };
    const out=mk(ids,road),inn=mk(ids.slice().reverse(),road?road.slice().reverse():null);
    const hw=clamp(Number(r.headway)||15,1,120);
    const n=clamp(Math.round(((out.L+v0*TURN)/v0)/(hw*60)),1,30);
    const from=stopsById[ids[0]],to=stopsById[ids[ids.length-1]];
    const provs=[];ids.forEach(id=>{const p=stopsById[id].province;if(p&&provs.indexOf(p)<0)provs.push(p);});
    const rt={id:r.id,no:String(r.no),type:type,fare:r.fare,first:r.first,last:r.last,headway:hw,v0:v0,n:n,
      geo:{out:out,in:inn},from:from.name,to:to.name,title:r.name||(from.name+' – '+to.name),
      provinces:provs,onRoad:!!road,code:r.code||'',thon:ids.filter(id=>stopsById[id].zone).length>=2,hay:'',raw:r};
    rt.hay=norm([rt.no,rt.code,rt.title,provs.join(' '),ids.some(id=>stopsById[id].zone)?'ฝั่งธนบุรี':'',ids.map(id=>stopsById[id].name+' '+(stopsById[id].en||'')+' '+stopsById[id].district+' '+stopsById[id].districtLabel).join(' ')].join('|'));
    routes.push(rt);
    ['out','in'].forEach(d=>{
      const g=rt.geo[d];
      g.ids.forEach((sid,idx)=>{
        if(idx===g.ids.length-1)return;
        (routesByStop[sid]=routesByStop[sid]||[]).push({rt:rt,d:d,idx:idx});
      });
    });
  });
  const stopList=data.stops.map(s=>stopsById[s.id]);
  return {stopsById,routes,routesByStop,stopList,routeById:routes.reduce((m,r)=>{m[r.id]=r;return m;},{})};
}
/* ---------- เครือข่ายรถไฟฟ้า ---------- */
const KIND_LABEL={BTS:'BTS',MRT:'MRT',ARL:'ARL',SRT:'SRT'};
function buildRail(rail){
  const st={};
  rail.stations.forEach(s=>{const dd=districtOf(s.lat,s.lon);st[s.id]=Object.assign({},s,proj(s.lat,s.lon),{district:dd?dd.n:'',districtLabel:distLabel(dd),lines:[],links:[]});});
  const lines=[],lineById={};
  rail.lines.forEach(l=>{
    const ids=(l.stations||[]).filter(id=>st[id]);
    if(ids.length<2)return;
    const uniq=[];ids.forEach(id=>{if(uniq.indexOf(id)<0)uniq.push(id);});
    uniq.forEach(id=>{if(st[id].lines.indexOf(l.id)<0)st[id].lines.push(l.id);});
    const cum=[0];
    for(let i=1;i<ids.length;i++)cum.push(cum[i-1]+Math.hypot(st[ids[i]].x-st[ids[i-1]].x,st[ids[i]].y-st[ids[i-1]].y));
    const ln={id:l.id,name:l.name,short:String(l.name).replace(/\sสาย/,' '),en:l.en||'',kind:l.kind||'MRT',color:l.color||'#38BDF8',kmh:clamp(Number(l.kmh)||32,10,120),headway:clamp(Number(l.headway)||6,1,60),
      ids:ids,uniq:uniq,cum:cum,km:cum[cum.length-1],ll:ids.map(id=>[st[id].lat,st[id].lon]),from:st[ids[0]].name,to:st[ids[ids.length-1]].name,hay:''};
    ln.hay=norm([ln.name,ln.en,ln.kind,ln.from,ln.to].join('|'));
    lines.push(ln);lineById[ln.id]=ln;
  });
  const link=(a,b)=>{if(a!==b&&st[a]&&st[b]){if(st[a].links.indexOf(b)<0)st[a].links.push(b);if(st[b].links.indexOf(a)<0)st[b].links.push(a);}};
  (rail.links||[]).forEach(g=>g.forEach(a=>g.forEach(b=>link(a,b))));
  const list=Object.keys(st).map(k=>st[k]).filter(x=>x.lines.length);
  list.forEach(a=>{      // สถานีต่างสายที่อยู่ใกล้กัน (<200 ม.) ถือว่าเปลี่ยนสายได้ (รวมสถานีที่แอดมินเพิ่มใหม่)
    list.forEach(b=>{if(a.id<b.id&&!a.lines.some(x=>b.lines.indexOf(x)>=0)&&Math.hypot(a.x-b.x,a.y-b.y)<0.2)link(a.id,b.id);});
  });
  list.forEach(x=>{
    x.kinds=[];x.lines.forEach(id=>{const k=lineById[id].kind;if(x.kinds.indexOf(k)<0)x.kinds.push(k);});
    x.isInterchange=x.lines.length>1||x.links.length>0;
    x.hay=norm([x.name,x.en,x.district,x.districtLabel,x.kinds.join(' '),x.lines.map(id=>lineById[id].name+' '+lineById[id].en).join(' '),x.isInterchange?'เปลี่ยนสาย interchange':''].join('|'));
  });
  return {stations:st,list:list,lines:lines,lineById:lineById};
}
// ขบวนถัดไป (จำลองจากความถี่) — คืนจำนวนนาทีถึงขบวนถัดไปของแต่ละทิศ
function nextTrains(rn,stationId,t){
  const out=[];
  rn.lines.forEach(ln=>{
    const idx=ln.ids.indexOf(stationId);if(idx<0)return;
    [[1,ln.ids[ln.ids.length-1]],[-1,ln.ids[0]]].forEach(([dir,end])=>{
      const last=dir===1?ln.ids.lastIndexOf(stationId):ln.ids.indexOf(stationId);
      if(dir===1&&last===ln.ids.length-1)return;
      if(dir===-1&&idx===0)return;
      const per=ln.headway*60,off=(hash(ln.id+':'+dir+':'+stationId)%1000)/1000*per;
      const wait=per-((t+off)%per);
      out.push({line:ln,dir:dir,to:rn.stations[end].name,min:Math.max(0,Math.ceil(wait/60)),sec:wait});
    });
  });
  return out;
}

/* ---------- ตัววางแผนเส้นทาง (สถานี/ป้ายต้นทาง → ปลายทาง) ----------
   กราฟ: โหนด = สถานีรถไฟฟ้า + ป้ายรถเมล์; ขอบ = วิ่งต่อสถานี/ป้าย (เวลา=ระยะ/ความเร็วเฉลี่ย + จอด) และเดินเปลี่ยน
   ขึ้นรถใหม่ = รอครึ่งหนึ่งของความถี่ + ค่าปรับการเปลี่ยนสาย (ปรับเพื่อให้ได้ทางเลือก "เร็วสุด/เปลี่ยนน้อย/รถไฟฟ้าล้วน") */
const WALK_KMH=4.5;
function planGraph(net,rn,withBus){
  const N={},adj={},wait={};
  const addN=(key,o)=>{N[key]=o;adj[key]=[];};
  rn.list.forEach(s=>addN('r:'+s.id,{k:'r',id:s.id,x:s.x,y:s.y,name:s.name,lat:s.lat,lon:s.lon}));
  if(withBus)net.stopList.forEach(s=>addN('b:'+s.id,{k:'b',id:s.id,x:s.x,y:s.y,name:s.name,lat:s.lat,lon:s.lon}));
  const E=(a,b,t,svc,kind,ref)=>{adj[a].push({to:b,t:t,svc:svc,kind:kind,ref:ref});adj[b].push({to:a,t:t,svc:svc,kind:kind,ref:ref});};
  const dist=(a,b)=>Math.hypot(N[a].x-N[b].x,N[a].y-N[b].y);
  rn.lines.forEach(ln=>{
    wait['L:'+ln.id]=ln.headway/2;
    for(let i=1;i<ln.ids.length;i++){const a='r:'+ln.ids[i-1],b='r:'+ln.ids[i];if(a===b)continue;E(a,b,dist(a,b)/ln.kmh*60+0.5,'L:'+ln.id,'ride',ln);}
  });
  if(withBus)net.routes.forEach(rt=>{
    wait['B:'+rt.id]=Math.min(rt.headway/2,12)+1;
    const ids=rt.geo.out.ids;
    for(let i=1;i<ids.length;i++){const a='b:'+ids[i-1],b='b:'+ids[i];E(a,b,dist(a,b)*1.25/(rt.v0*60)+0.4,'B:'+rt.id,'ride',rt);}
  });
  const walk=d=>d/WALK_KMH*60+1.5;
  rn.list.forEach(a=>a.links.forEach(id=>{if(a.id<id&&N['r:'+id])E('r:'+a.id,'r:'+id,Math.max(3,walk(dist('r:'+a.id,'r:'+id))),'W','walk',null);}));
  if(withBus){
    const keys=Object.keys(N),rs=keys.filter(k=>k[0]==='r'),bs=keys.filter(k=>k[0]==='b');
    rs.forEach(a=>bs.forEach(b=>{const d=dist(a,b);if(d<0.35)E(a,b,walk(d),'W','walk',null);}));
    bs.forEach(a=>bs.forEach(b=>{if(a<b){const d=dist(a,b);if(d<0.25&&d>0.0001)E(a,b,walk(d),'W','walk',null);}}));
  }
  return {N:N,adj:adj,wait:wait};
}
function dijkstraPlan(G,from,to,pen){
  const dist={},prev={},done={};
  const start=from+'|';dist[start]=0;
  const open=[[0,start]];
  let goal=null;
  while(open.length){
    let bi=0;for(let i=1;i<open.length;i++)if(open[i][0]<open[bi][0])bi=i;
    const cur=open.splice(bi,1)[0],key=cur[1],d=cur[0];
    if(done[key])continue;done[key]=1;
    const bar=key.indexOf('|'),node=key.slice(0,bar),svc=key.slice(bar+1);
    if(node===to){goal=key;break;}
    G.adj[node].forEach(e=>{
      let c=e.t;
      if(e.kind==='ride'&&e.svc!==svc)c+=(G.wait[e.svc]||3)+(svc&&svc!=='W0'?pen:0);   // ขึ้นสายใหม่ = รอ + ค่าปรับการเปลี่ยนสาย (ยกเว้นการขึ้นครั้งแรก)
      const nk=e.to+'|'+(e.kind==='walk'?(svc===''||svc==='W0'?'W0':'W1'):e.svc),nd=d+c;
      if(dist[nk]===undefined||nd<dist[nk]-1e-9){dist[nk]=nd;prev[nk]={k:key,e:e,from:node};open.push([nd,nk]);}
    });
  }
  if(!goal)return null;
  const edges=[];let k=goal;
  while(prev[k]){edges.push({e:prev[k].e,from:prev[k].from,to:k.slice(0,k.indexOf('|')),acc:dist[k]});k=prev[k].k;}
  edges.reverse();
  return {total:dist[goal],edges:edges};
}
function legsOf(G,res,rn,net){
  const legs=[];let prevAcc=0;
  res.edges.forEach(x=>{
    const e=x.e,key=e.kind==='walk'?'W':e.svc;
    let L=legs[legs.length-1];
    if(!L||L.key!==key){
      L={key:key,kind:e.kind==='walk'?'walk':'ride',ref:e.ref,from:x.from,to:x.to,n:0,mins:0,nodes:[x.from]};
      if(L.kind==='ride'){L.wait=G.wait[e.svc]||0;}
      legs.push(L);
    }
    L.to=x.to;L.n++;L.nodes.push(x.to);L.mins+=x.acc-prevAcc;prevAcc=x.acc;
  });
  return legs.map(L=>{
    const a=G.N[L.from],b=G.N[L.to];
    const isRail=L.kind==='ride'&&L.key[0]==='L';
    return {kind:L.kind,mode:L.kind==='walk'?'walk':isRail?'rail':'bus',key:L.key,
      label:L.kind==='walk'?'เดินเปลี่ยน':isRail?L.ref.name:'รถเมล์สาย '+L.ref.no,
      color:L.kind==='walk'?'#94A3B8':isRail?L.ref.color:TYPES[L.ref.type].hex,
      ref:L.ref,from:a.name,to:b.name,fromKey:L.from,toKey:L.to,n:L.n,mins:Math.max(1,Math.round(L.mins)),
      wait:L.wait?Math.max(1,Math.round(L.wait)):0,ll:L.nodes.map(k=>[G.N[k].lat,G.N[k].lon])};
  });
}
function planTrips(net,rn,fromKey,toKey){
  if(!fromKey||!toKey||fromKey===toKey)return [];
  const out=[],seen={};
  const bothRail=fromKey[0]==='r'&&toKey[0]==='r';
  const Gall=planGraph(net,rn,true);
  if(!Gall.N[fromKey]||!Gall.N[toKey])return [];
  const variants=[{id:'fast',G:Gall,pen:0,label:'เร็วที่สุด'},{id:'few',G:Gall,pen:10,label:'เปลี่ยนต่อน้อยที่สุด'}];
  if(bothRail)variants.push({id:'rail',G:planGraph(net,rn,false),pen:3,label:'รถไฟฟ้าอย่างเดียว'});
  variants.forEach(v=>{
    const res=dijkstraPlan(v.G,fromKey,toKey,v.pen);if(!res)return;
    const legs=legsOf(v.G,res,rn,net).filter(l=>l.n>0);
    const sig=legs.map(l=>l.key+':'+l.fromKey+'>'+l.toKey).join('/');
    if(seen[sig])return;seen[sig]=1;
    const rides=legs.filter(l=>l.kind==='ride');
    out.push({id:v.id,tag:v.label,minutes:Math.max(1,Math.round(res.total)),transfers:Math.max(0,rides.length-1),legs:legs,
      stops:rides.reduce((a,l)=>a+l.n,0),rideMin:rides.reduce((a,l)=>a+l.mins,0),waitMin:rides.reduce((a,l)=>a+l.wait,0),
      walkMin:legs.filter(l=>l.kind==='walk').reduce((a,l)=>a+l.mins,0)});
  });
  out.sort((a,b)=>a.minutes-b.minutes);
  if(out[0])out[0].tag=out[0].tag==='เร็วที่สุด'?'เร็วที่สุด':out[0].tag+' · เร็วที่สุด';
  return out;
}

function pointAt(g,s){
  const c=g.pc;let lo=0,hi=c.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(c[m]<=s)lo=m;else hi=m;}
  const seg=c[hi]-c[lo]||1,f=clamp((s-c[lo])/seg,0,1),a=g.pp[lo],b=g.pp[hi];
  return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};
}
function busAt(rt,d,b,t){
  const g=rt.geo[d],n=rt.n,v0=rt.v0,C=g.L+v0*TURN;
  const id=rt.id+':'+d+':'+b;
  const ph=(hash(id)%628)/100;
  const base=(b/n)*C+(d==='in'?C/(2*n):0);
  const raw=base+v0*(t+(AMP/W)*(Math.cos(ph)-Math.cos(W*t+ph)));
  const lap=Math.floor(raw/C),s=raw-lap*C;
  const parked=s>g.L;
  const pos=pointAt(g,Math.min(s,g.L));
  return {id:id,rt:rt,d:d,b:b,s:s,C:C,lap:lap,parked:parked,x:pos.x,y:pos.y,
    kmh:parked?0:v0*3600*(1+AMP*Math.sin(W*t+ph)),
    code:rt.no+'-'+(d==='out'?'A':'B')+pad(b+1),
    plate:(10+hash(id)%80)+'-'+(1000+hash(id+'p')%9000)};
}
function simulate(net,t){
  const buses=[],bi={};
  net.routes.forEach(rt=>{['out','in'].forEach(d=>{
    const arr=bi[rt.id+':'+d]=[];
    for(let b=0;b<rt.n;b++){const x=busAt(rt,d,b,t);buses.push(x);arr.push(x);}
  });});
  return {net:net,buses:buses,bi:bi,t:t};
}
function crowdOf(bus,t){const k=hash(bus.id+':'+Math.floor(t/150))%100;return k<42?0:k<80?1:2;}
function arrivalsAt(sim,rt,d,idx){
  const g=rt.geo[d],D=g.cum[idx],out=[];
  (sim.bi[rt.id+':'+d]||[]).forEach(b=>{
    let delta=D-b.s,wrapped=false;
    if(delta<-0.03){delta+=b.C;wrapped=true;}else if(delta<0)delta=0;
    out.push({bus:b,delta:delta,eta:delta/rt.v0,lapKey:b.lap+(wrapped?1:0)});
  });
  return out.sort((a,b)=>a.eta-b.eta);
}
function stopArrivals(sim,stopId){
  const list=(sim.net.routesByStop[stopId]||[]).map(e=>({rt:e.rt,d:e.d,idx:e.idx,items:arrivalsAt(sim,e.rt,e.d,e.idx)}));
  return list.filter(x=>x.items.length).sort((a,b)=>a.items[0].eta-b.items[0].eta);
}
function nextStopOf(sim,bus){
  const g=bus.rt.geo[bus.d];
  if(bus.parked)return {name:g.ids.length?sim.net.stopsById[g.ids[0]].name:'',text:'จอดพักที่ปลายทาง'};
  let i=0;while(i<g.cum.length-1&&g.cum[i]<bus.s-0.0001)i++;
  const st=sim.net.stopsById[g.ids[i]];
  return {name:st.name,eta:(g.cum[i]-bus.s)/bus.rt.v0,km:g.cum[i]-bus.s,idx:i};
}

function norm(s){return String(s||'').toLowerCase().replace(/[\s\-–—.]+/g,'');}
const ALIAS={'กทม':'กรุงเทพมหานคร','กรุงเทพ':'กรุงเทพมหานคร','กรุงเทพฯ':'กรุงเทพมหานคร','bkk':'กรุงเทพมหานคร','bangkok':'กรุงเทพมหานคร','nonthaburi':'นนทบุรี','samutprakan':'สมุทรปราการ','pathumthani':'ปทุมธานี','ปากเกร็ด':'นนทบุรี'};
function queryTerms(q){
  let n=norm(q);if(!n)return [];
  const noPrefix=n.replace(/^สาย/,'');
  const out=[n];if(noPrefix&&noPrefix!==n)out.push(noPrefix);
  if(ALIAS[noPrefix])out.push(norm(ALIAS[noPrefix]));
  return out;
}
function routeScore(rt,terms){
  if(!terms.length)return 1;
  let best=0;
  terms.forEach(t=>{
    const no=norm(rt.no);
    if(no===t)best=Math.max(best,100);else if(no.indexOf(t)===0)best=Math.max(best,80);
    else if(rt.hay.indexOf(t)>=0)best=Math.max(best,30);
  });
  return best;
}
function stopHay(s,net){
  const rts=(net.routesByStop[s.id]||[]).map(e=>e.rt.no).join(' ');
  return norm([s.name,s.en,s.province,s.district,s.districtLabel,s.zone,(s.tags||[]).join(' '),rts].join('|'));
}
function stopScore(s,terms,net){
  if(!terms.length)return 1;
  const h=stopHay(s,net);let best=0;
  terms.forEach(t=>{if(norm(s.name).indexOf(t)===0)best=Math.max(best,80);else if(h.indexOf(t)>=0)best=Math.max(best,30);});
  return best;
}

const SYS=window.bustimeSystem||null;
function b2h(buf){return Array.from(new Uint8Array(buf)).map(x=>pad(0)+x.toString(16)).map(x=>x.slice(-2)).join('');}
function h2b(h){const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
async function pbk(pw,saltHex){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:h2b(saltHex),iterations:150000,hash:'SHA-256'},key,256);
  return b2h(bits);
}
const localFail={n:0,until:0};
const Auth={
  async status(){
    if(SYS)return SYS.auth.status();
    return {configured:!!store.get('bustime.admin',null),desktop:false};
  },
  async setup(pw){
    if(SYS)return SYS.auth.setup(pw);
    if(!pw||pw.length<8)return {ok:false,error:'รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร'};
    if(!(window.crypto&&crypto.subtle))return {ok:false,error:'เบราว์เซอร์นี้ไม่รองรับการเข้ารหัสรหัสผ่าน'};
    const salt=b2h(crypto.getRandomValues(new Uint8Array(16)));
    store.set('bustime.admin',{salt:salt,hash:await pbk(pw,salt)});
    return {ok:true};
  },
  async login(pw){
    if(SYS)return SYS.auth.login(pw);
    const now=Date.now();
    if(now<localFail.until)return {ok:false,error:'พยายามหลายครั้งเกินไป รออีก '+Math.ceil((localFail.until-now)/1000)+' วินาที'};
    const rec=store.get('bustime.admin',null);
    if(!rec)return {ok:false,error:'ยังไม่ได้ตั้งรหัสผ่านแอดมิน'};
    const hsh=await pbk(pw||'',rec.salt);
    if(hsh===rec.hash){localFail.n=0;return {ok:true};}
    localFail.n++;if(localFail.n>=5){localFail.until=now+30000;localFail.n=0;}
    return {ok:false,error:'รหัสผ่านไม่ถูกต้อง'};
  },
  async logout(){if(SYS)return SYS.auth.logout();return {ok:true};}
};

function boundsOf(pts){
  let b={minx:1e9,maxx:-1e9,miny:1e9,maxy:-1e9};
  pts.forEach(p=>{b.minx=Math.min(b.minx,p.x);b.maxx=Math.max(b.maxx,p.x);b.miny=Math.min(b.miny,p.y);b.maxy=Math.max(b.maxy,p.y);});
  return b;
}

const BKK_CENTER=[THON_VIEW.lat,THON_VIEW.lon];   // เริ่มที่ฝั่งธนบุรี-เพชรเกษม (13.7115, 100.3885) ซูม 13

const GEO=(typeof window!=='undefined'&&window.__GEO)||null;
const geoLL=(a,k)=>{const o=[];let la=0,lo=0;for(let i=0;i<a.length;i+=2){if(i===0){la=a[0];lo=a[1];}else{la+=a[i];lo+=a[i+1];}o.push([la/k,lo/k]);}return o;};
const geoPoly=(rings,k)=>rings.map(r=>geoLL(r,k));
const chaikin=(p,n)=>{for(let t=0;t<n;t++){if(p.length<3)return p;const o=[p[0]];for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];o.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]],[.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]]);}o.push(p[p.length-1]);p=o;}return p;};
const RW={hw:[1.4,6,1.25],rd:[0.9,9,1.3],mn:[0.7,11,1.3]};   // [กว้างขั้นต่ำ px, ซูมฐาน, ตัวคูณต่อระดับซูม]
const roadW=(c,z)=>{const q=RW[c];return Math.min(26,Math.max(q[0],q[0]*Math.pow(q[2],z-q[1])));};
const riverW=(m,z)=>Math.min(70,Math.max(1.2,m/(152500/Math.pow(2,z))));   // ความกว้างจริง (ม.) → พิกเซล
const LBL_FS={cnt:13,reg:15,prov:11.5,dist:10.5,rname:10.5,pname:10.5,wname:11.5,pill:11};
const RIV_TH={'Mekong':'แม่น้ำโขง','Chao Phraya':'แม่น้ำเจ้าพระยา','Mun':'แม่น้ำมูล','Chi':'แม่น้ำชี','Ping':'แม่น้ำปิง','Yom':'แม่น้ำยม','Mae Klong':'แม่น้ำแม่กลอง','Salween':'แม่น้ำสาละวิน'};

/* ตัวสร้างพื้นแผนที่ + ตัวจัดวางป้ายชื่อแบบไม่ทับกัน (collision culling ตามระดับซูม) */
function makeBasemap(map,SV,L,dists){
  const B={},labels=[],extra=[],shown={};let raf=0;
  const poly=(rings,cls,rend,pane)=>L.polygon(rings,{pane:pane,renderer:rend,interactive:false,className:cls,smoothFactor:0.6}).addTo(map);
  const bb=r=>{let a=1e9,b=-1e9,c=1e9,d=-1e9;r.forEach(q=>{if(q[0]<a)a=q[0];if(q[0]>b)b=q[0];if(q[1]<c)c=q[1];if(q[1]>d)d=q[1];});return Math.hypot(b-a,d-c);};
  GEO.nb.forEach(c=>c[1].forEach(pg=>poly(geoPoly(pg,1000),'bm-nb',SV.land,'bmland')));
  GEO.prov.forEach(pv=>{let big=0;pv[5].forEach(pg=>{const rg=geoPoly(pg,1000);big=Math.max(big,bb(rg[0]));poly(rg,'bm-th',SV.land,'bmland');});
    labels.push({k:'p'+pv[0],cls:'prov',t:pv[1].replace(/^จังหวัด/,''),lat:pv[3],lon:pv[4],min:pv[0]==='TH10'?8:7,max:11,pri:20+Math.min(40,big*14)});});
  GEO.lake.forEach(rs=>poly(geoPoly(rs,1000),'bm-lake',SV.water,'bmwater'));
  // แม่น้ำ (เส้นกึ่งกลาง ปรับความกว้างตามซูม)
  const rivs=[];
  GEO.riv.forEach(rv=>{const n=rv[0],w=rv[1];let best=null;
    rv[2].forEach(l=>{const pts=chaikin(geoLL(l,1000),1);rivs.push([L.polyline(pts,{pane:'bmwater',renderer:SV.water,interactive:false,className:'bm-riv',smoothFactor:0.4}).addTo(map),w]);
      if(RIV_TH[n]&&(!best||pts.length>best.length))best=pts;});
    if(RIV_TH[n]&&best){let pick=best[Math.floor(best.length/2)];
      if(n==='Chao Phraya'){let d=1e9;best.forEach(q=>{const e=Math.hypot(q[0]-13.79,q[1]-100.49);if(e<d){d=e;pick=q;}});}
      labels.push({k:'r'+n,cls:'wname',t:RIV_TH[n],lat:pick[0],lon:pick[1],min:n==='Chao Phraya'?11:8,max:16,pri:14});}});
  // ถนน: ชั้น hw/rd/mn (Natural Earth ทั่วประเทศ) + ถนนในกรุงเทพฯ ที่เขียนเอง; แต่ละชั้นมี pane/renderer ของตัวเอง (ชั้นสำคัญอยู่บน)
  const PANE={mn:'bmr1',rd:'bmr2',hw:'bmr3'},groups=[];
  const mkGroup=(cls,minz,lines)=>{const g={cls:cls,minz:minz,cas:L.layerGroup(),fil:L.layerGroup(),items:[]};
    lines.forEach(pts=>{const o={pane:PANE[cls],renderer:SV[PANE[cls]],interactive:false,smoothFactor:1};
      const a=L.polyline(pts,Object.assign({className:'bm-rc '+cls},o)),b=L.polyline(pts,Object.assign({className:'bm-rf '+cls},o));g.cas.addLayer(a);g.fil.addLayer(b);g.items.push([a,b]);});
    groups.push(g);return g;};
  const dec=ls=>ls.map(l=>geoLL(l,1000));
  mkGroup('mn',11,dec(GEO.rd.mn));mkGroup('rd',9,dec(GEO.rd.rd));mkGroup('hw',6,dec(GEO.rd.hw));
  const bk=GEO.bkk,bkr=bk.roads.map(r=>[r[0],r[1],chaikin(geoLL(r[2],10000),0)]);
  mkGroup('rd',11,bkr.filter(r=>r[1]==='ar').map(r=>r[2]));mkGroup('hw',7,bkr.filter(r=>r[1]==='mj').map(r=>r[2]));
  bkr.forEach(r=>{const m=r[2][Math.floor(r[2].length/2)];labels.push({k:'n'+r[0],cls:'rname',t:r[0],lat:m[0],lon:m[1],min:r[1]==='mj'?12:13,max:19,pri:16});});
  // สวนสาธารณะ
  const parks=L.layerGroup();
  bk.parks.forEach(pk=>{const rg=geoLL(pk[1],10000);L.polygon(rg,{pane:'bmpark',renderer:SV.bmpark,interactive:false,className:'bm-park'}).addTo(parks);
    let la=0,lo=0;rg.forEach(q=>{la+=q[0];lo+=q[1];});labels.push({k:'k'+pk[0],cls:'pname',t:pk[0],lat:la/rg.length,lon:lo/rg.length,min:14,max:19,pri:12});});
  // เขต/อำเภอ + ป้ายคงที่
  dists.forEach(d=>labels.push({k:'d'+d.n+d.p,cls:'dist',t:d.n,lat:d.c[0],lon:d.c[1],min:d.p==='กรุงเทพมหานคร'?12:11,max:19,pri:15}));
  FIX_LBL.forEach((f,i)=>labels.push({k:'f'+i,cls:f[0],t:f[1],lat:f[2],lon:f[3],min:f[4],max:f[5],pri:f[0]==='reg'?90:f[0]==='cnt'?80:70}));
  // ---- ปรับชั้น/ความกว้างตามซูม ----
  B.refresh=()=>{const z=map.getZoom();
    groups.forEach(g=>{const on=z>=g.minz,has=map.hasLayer(g.cas);
      if(on&&!has){map.addLayer(g.cas);map.addLayer(g.fil);}if(!on&&has){map.removeLayer(g.cas);map.removeLayer(g.fil);}
      if(on){const w=roadW(g.cls,z),cw=w+(g.cls==='hw'?(z>=9?2:1):1.4);g.items.forEach(it=>{it[0].setStyle({weight:cw});it[1].setStyle({weight:w});});}});
    const pOn=z>=12;if(pOn&&!map.hasLayer(parks))map.addLayer(parks);if(!pOn&&map.hasLayer(parks))map.removeLayer(parks);
    rivs.forEach(r=>r[0].setStyle({weight:riverW(r[1],z)}));
    B.layout();};
  // ---- จัดวางป้ายชื่อ: เรียงตามความสำคัญ ข้ามป้ายที่ทับกัน ----
  B.layout=()=>{
    const z=map.getZoom(),sz=map.getSize(),cand=[];
    const add=l=>{if(z<l.min||z>l.max)return;const p=map.latLngToContainerPoint([l.lat,l.lon]);if(p.x<-80||p.y<-30||p.x>sz.x+80||p.y>sz.y+30)return;cand.push({l:l,p:p});};
    labels.forEach(add);extra.forEach(add);
    cand.sort((a,b)=>b.l.pri-a.l.pri);
    const taken=[],keep={};
    cand.forEach(c=>{const l=c.l,pill=l.cls==='pill',fs=LBL_FS[l.cls]||11,w=l.t.length*fs*0.6+(pill?18:6),h=fs+(pill?9:5),x0=pill?c.p.x+8:c.p.x-w/2,r=[x0,c.p.y-h/2,x0+w,c.p.y+h/2];
      for(let i=0;i<taken.length;i++){const t=taken[i];if(r[0]<t[2]&&r[2]>t[0]&&r[1]<t[3]&&r[3]>t[1])return;}
      taken.push(r);keep[l.k]=l;});
    Object.keys(shown).forEach(k=>{if(!keep[k]){map.removeLayer(shown[k]);delete shown[k];}});
    Object.keys(keep).forEach(k=>{if(shown[k])return;const l=keep[k],pill=l.cls==='pill';
      shown[k]=L.marker([l.lat,l.lon],{pane:pill?'pillpane':'bmlabel',interactive:false,keyboard:false,
        icon:L.divIcon({className:'bml '+l.cls,html:'<span'+(l.color?' style="--lc:'+l.color+'"':'')+'>'+esc(l.t)+'</span>',iconSize:[0,0]})}).addTo(map);});
  };
  B.relayout=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(map._loaded)B.layout();});};
  B.setExtra=list=>{extra.length=0;list.forEach(x=>extra.push(x));Object.keys(shown).forEach(k=>{if(k.charAt(0)==='x'){map.removeLayer(shown[k]);delete shown[k];}});B.relayout();};
  return B;
}

    const rt=net.routes.filter(r=>r.hay.indexOf(n)>=0).slice(0,3);

    ${dirOpen&&html`<div className="mdir" role="group" aria-label="ค้นหาเส้นทาง ต้นทาง-ปลายทาง">
      <${PlacePicker} id="md-from" label="ต้นทาง" mark="A" value=${plan.from} options=${opts} onChange=${v=>setPlan(q=>Object.assign({},q,{from:v,sel:0}))} placeholder="เลือกสถานี/ป้ายต้นทาง"/>

const KINDS=[['all','ทั้งหมด'],['BTS','BTS'],['MRT','MRT'],['ARL','ARL'],['SRT','SRT']];
function LTag({ln}){return html`<span className="ltag" style=${{background:ln.color,color:inkOn(ln.color)}}>${ln.short||ln.name}</span>`;}
function ThemeToggle({theme,setTheme}){
  return html`<div className="theme" role="group" aria-label="โหมดสี (Theme)">
    <button className=${theme==='dark'?'on':''} aria-pressed=${theme==='dark'?'true':'false'} title="ดำ (Dark Mode)" onClick=${()=>setTheme('dark')}><${Icon} n="moon" s=${14}/><span>ดำ</span></button>
    <button className=${theme==='light'?'on':''} aria-pressed=${theme==='light'?'true':'false'} title="ขาว (Light Mode)" onClick=${()=>setTheme('light')}><${Icon} n="sun" s=${14}/><span>ขาว</span></button>
  </div>`;
}

function RailTab({rn,openLine,openStation,onFocusPts}){
  const [q,setQ]=useState('');const [kind,setKind]=useState('all');
  const nq=norm(q);
  const lines=rn.lines.filter(l=>(kind==='all'||l.kind===kind)&&(!nq||l.hay.indexOf(nq)>=0));
  const sts=useMemo(()=>{
    if(!nq)return [];
    return rn.list.filter(x=>(kind==='all'||x.kinds.indexOf(kind)>=0)&&x.hay.indexOf(nq)>=0)
      .map(x=>({x:x,sc:norm(x.name).indexOf(nq)===0?0:norm(x.name).indexOf(nq)>0?1:2}))
      .sort((a,b)=>a.sc-b.sc||a.x.name.localeCompare(b.x.name,'th')).slice(0,60).map(o=>o.x);
  },[rn,nq,kind]);
  const sig=nq?sts.map(x=>x.id).join(','):'';
  useEffect(()=>{if(!nq||!sts.length||!onFocusPts)return;const id=setTimeout(()=>onFocusPts(sts.slice(0,40)),450);return()=>clearTimeout(id);},[sig]);
  return html`<${React.Fragment}>
    <div className="panel-head">
      <label className="search"><${Icon} n="search"/><span className="sr">ค้นหาสถานีรถไฟฟ้า</span>
        <input id="q-rail" type="search" placeholder="ค้นหาสถานี/สายรถไฟฟ้า เช่น อโศก, สยาม, บางหว้า, สีม่วง" value=${q} onChange=${e=>setQ(e.target.value)}/></label>
      <div className="chips" role="group" aria-label="ประเภทรถไฟฟ้า">${KINDS.map(k=>html`<button key=${k[0]} className=${'chip'+(kind===k[0]?' on':'')} onClick=${()=>setKind(k[0])}>${k[1]}</button>`)}</div>
    </div>
    <div className="panel-body">
      ${lines.length>0&&html`<div className="sec">สายรถไฟฟ้า (${lines.length})</div>`}
      ${lines.map(ln=>html`<button key=${ln.id} className="lrow" style=${{'--lc':ln.color}} onClick=${()=>openLine(ln.id)}>
        <span className="bar"></span>
        <span className="mid"><span className="t1">${ln.name}</span><span className="t2" style=${{display:'block'}}>${ln.from} – ${ln.to} · ${ln.uniq.length} สถานี · ทุก ~${ln.headway} นาที</span></span>
        <${Icon} n="down" s=${16}/></button>`)}
      ${nq&&html`<div className="sec">สถานี (${sts.length}${sts.length>=60?'+':''})</div>`}
      ${nq&&sts.length===0&&lines.length===0&&html`<div className="empty">ไม่พบสถานีหรือสายที่ตรงกับ “${q}”</div>`}
      ${sts.map(x=>html`<button key=${x.id} className="lkrow" onClick=${()=>openStation(x.id)}>
        <b>${x.name}</b><span style=${{display:'flex',gap:4,flexWrap:'wrap'}}>${x.lines.map(id=>html`<${LTag} key=${id} ln=${rn.lineById[id]}/>`)}</span>
        ${x.isInterchange&&html`<span className="tag">สถานีเชื่อมต่อ</span>`}</button>`)}
      ${!nq&&html`<div className="note">รถไฟฟ้า ${rn.lines.length} สาย · ${rn.list.length} สถานี · สถานีที่มีป้าย “สถานีเชื่อมต่อ” เปลี่ยนสายได้ รายชื่อและพิกัดสถานีเป็นค่าประมาณ ตรวจสอบกับข้อมูลทางการก่อนใช้งานจริง</div>`}
    </div>
  <//>`;
}

    <button className="back" onClick=${back}><${Icon} n="back" s=${16}/>กลับ</button>

    <div className="sec">ขบวนถัดไป (จำลองจากความถี่)</div>
    ${trains.length===0&&html`<div className="empty">ไม่มีข้อมูลขบวน</div>`}
    ${trains.map((x,i)=>html`<div key=${i} className="trow"><${LTag} ln=${x.line}/><span className="to">ไป ${x.to}</span><span className="te">${x.min<=0?'ไม่ถึง 1':'~'+x.min} นาที</span></div>`)}
    ${st.links.length>0&&html`<div className="sec">เปลี่ยนสาย / สถานีเชื่อมต่อ</div>`}

    <div className="sec">ป้ายรถเมล์ใกล้เคียง</div>
    ${near.length===0&&html`<div className="empty">ไม่มีป้ายรถเมล์ในรัศมี 450 ม.</div>`}
    ${near.map(o=>{const rts=(net.routesByStop[o.s.id]||[]).map(e=>e.rt).filter((r,i,a)=>a.indexOf(r)===i);
      return html`<button key=${o.s.id} className="lkrow" onClick=${()=>openStop(o.s.id)}><b>${o.s.name}</b><span style=${{color:'var(--muted)',fontSize:12}}>${fmtDist(o.d)}</span>
        <span className="minis">${rts.slice(0,6).map(r=>html`<${RNo} key=${r.id} rt=${r} small=${true}/>`)}</span></button>`;})}
    <div className="note">เวลาขบวนถัดไปเป็นค่าจำลองจากความถี่เฉลี่ยของสาย ไม่ใช่เวลาจริงจากผู้ให้บริการ</div>

function placeOptions(net,rn){
  const out=[];
  rn.list.forEach(x=>out.push({key:'r:'+x.id,name:x.name,sub:x.lines.map(id=>rn.lineById[id].short).join(' · '),color:rn.lineById[x.lines[0]].color,hay:x.hay,rail:true,pop:x.isInterchange}));
  net.stopList.forEach(x=>out.push({key:'b:'+x.id,name:x.name,sub:'ป้ายรถเมล์ · '+(x.districtLabel||x.province),color:'var(--sky)',hay:stopHay(x,net),rail:false,pop:false}));
  return out;
}
function PlacePicker({id,label,mark,value,options,onChange,placeholder}){
  const cur=value?options.find(o=>o.key===value):null;
  const [q,setQ]=useState('');const [open,setOpen]=useState(false);
  const list=useMemo(()=>{
    if(!open)return [];
    const n=norm(q);
    if(!n)return options.filter(o=>o.pop).slice(0,8);
    return options.filter(o=>o.hay.indexOf(n)>=0).map(o=>({o:o,sc:(norm(o.name).indexOf(n)===0?0:1)+(o.rail?0:0.5)}))
      .sort((a,b)=>a.sc-b.sc).slice(0,8).map(x=>x.o);
  },[open,q,options]);
  return html`<div className="pp">
    <label htmlFor=${id}>${label}</label>
    <div className="ppin"><span className="ab">${mark}</span>
      <input id=${id} autoComplete="off" value=${open?q:(cur?cur.name:'')} placeholder=${placeholder}
        onFocus=${()=>{setOpen(true);setQ('');}} onBlur=${()=>setTimeout(()=>setOpen(false),160)} onChange=${e=>{setQ(e.target.value);setOpen(true);}}/>
      ${cur&&html`<button type="button" className="icbtn" aria-label=${'ล้าง'+label} onMouseDown=${e=>e.preventDefault()} onClick=${()=>{onChange(null);setQ('');}}><${Icon} n="close" s=${14}/></button>`}
    </div>
    ${open&&list.length>0&&html`<ul className="ppl" role="listbox">${list.map(o=>html`<li key=${o.key}><button type="button" onMouseDown=${e=>e.preventDefault()} onClick=${()=>{onChange(o.key);setOpen(false);}}>
      <i className="dotc" style=${{background:o.color}}></i><span><b style=${{fontWeight:500}}>${o.name}</b><small>${o.sub}</small></span></button></li>`)}</ul>`}
  </div>`;
}

          ${lg.kind==='walk'?html`<span className="lk walk" title="เดิน"><${Icon} n="walk" s=${14}/></span>`
            :html`<span className="lk" style=${{background:lg.color,color:inkOn(lg.color)}}>${lg.mode==='bus'?lg.ref.no:lg.ref.kind}</span>`}
          <div className="tx">${lg.kind==='walk'?html`<b style=${{fontWeight:500}}>เดินไป ${lg.to}</b><small>~${lg.mins} นาที</small>`
            :html`<b style=${{fontWeight:500}}>${lg.label}</b><small>ขึ้นที่ ${lg.from} → ลงที่ ${lg.to}</small><small>${lg.n} ${lg.mode==='rail'?'สถานี':'ป้าย'} · ~${lg.mins} นาที${lg.wait?' (รอ ~'+lg.wait+' นาที)':''}</small>`}</div></div>`)}
        <div style=${{fontSize:11.5,color:'var(--muted)'}}>นั่ง ~${r.rideMin} นาที · รอ ~${r.waitMin} นาที${r.walkMin?' · เดิน ~'+r.walkMin+' นาที':''}</div>
      </div>`)}
      ${results.length>0&&(()=>{const pt=k=>k[0]==='r'?rn.stations[k.slice(2)]:net.stopsById[k.slice(2)];const a=pt(plan.from),b=pt(plan.to);return a&&b?html`<a className="gmap" href=${gmapsDir(a,b)} target="_blank" rel="noopener noreferrer">เปรียบเทียบเส้นทางนี้ใน Google Maps ↗</a>`:null;})()}
      ${results.length>0&&html`<div className="note">เวลาเป็นค่าประมาณจากระยะทาง ความเร็วเฉลี่ย และความถี่ของแต่ละสาย (ไม่ใช่ตารางเดินรถจริง) แตะการ์ดเพื่อดูเส้นทางบนแผนที่</div>`}
    </div>
  <//>`;
}

function GuideTab({rn,go}){

    <div className="dh"><span style=${{color:'var(--sky)'}}><${Icon} n="book" s=${26}/></span><div><h2>คู่มือการใช้งาน (How to Use)</h2><div className="sub">BUS TIME — รถเมล์ · BTS · MRT · ARL · SRT</div></div></div>
    <div className="gcard"><h3><span className="n">1</span>ค้นหาเส้นทางจากสถานีต้นทางไปปลายทาง</h3>

        <li>แตะการ์ดผลลัพธ์เพื่อวาดเส้นทางบนแผนที่ (จุด A→B ตามสีประจำสาย เส้นประ = เดินเปลี่ยน)</li></ol>

        <li>แท็บ <b>สายรถ</b>: ค้นหาเลขสาย ย่าน หรือรหัสสาย เช่น 80, บางแค, 4-43 แล้วแตะเพื่อดูเส้นทางและป้ายตลอดสาย</li>
        <li>แท็บ <b>ป้าย</b>: ค้นหาป้าย หรือกด “ใกล้ฉัน” เพื่อหาป้ายรอบตัว สถานีที่มีป้าย “สถานีเชื่อมต่อ” คือจุดเปลี่ยนสาย</li></ol>

    <div className="gcard"><h3><span className="n">3</span>ใช้งานแผนที่และสลับโหมดสี (Dark / Light)</h3>

        <li>ปุ่ม <b>รถเมล์ / รถไฟฟ้า</b> มุมบนซ้ายของแผนที่ เปิด-ปิดชั้นข้อมูล</li>

    <div className="gcard"><h3><span className="n">4</span>เช็กเวลาและสถานะรถมาถึง (Real-time ETA)</h3>
      <ul><li>เลือกสายรถเมล์ → ดูเวลานับถอยหลังของแต่ละป้าย รถที่กำลังวิ่งพร้อมทะเบียน ความเร็ว และความหนาแน่น (ว่าง/ปานกลาง/แน่น)</li>
        <li>แตะรถบนแผนที่เพื่อติดตามคันนั้น กดรูประฆังที่ป้ายเพื่อให้แจ้งเตือนก่อนรถถึง และกดดาวเพื่อเก็บเป็นรายการโปรด</li>
        <li>รถไฟฟ้า: หน้าสถานีแสดง “ขบวนถัดไป” ของแต่ละทิศ</li></ul>
      <button className="btn sm go" onClick=${()=>go('routes')}><${Icon} n="bus" s=${14}/>ไปที่ สายรถ</button></div>
    <div className="note"><b>เกี่ยวกับข้อมูล:</b> ตำแหน่งรถและเวลาขบวนเป็นค่าจำลอง ไม่ใช่ข้อมูลเรียลไทม์จริง รายชื่อ/ลำดับ/พิกัดสถานีรถไฟฟ้าและป้ายรถเมล์เป็นค่าประมาณ ตรวจสอบกับข้อมูลทางการ (เช่น GTFS) ก่อนใช้งานจริง ผู้ดูแลแก้ไขได้ที่แท็บแอดมิน</div>
  </div>`;
}

/* ---------- แอดมิน: จัดการสถานีรถไฟฟ้า / สาย ---------- */
function LineEditor({init,onSave,onCancel,onDelete}){
  const isNew=!init.id;
  const [f,setF]=useState({name:init.name||'',en:init.en||'',kind:init.kind||'MRT',color:init.color||'#38BDF8',headway:String(init.headway||6),kmh:String(init.kmh||34)});
  const [err,setErr]=useState('');
  const set=k=>e=>setF(Object.assign({},f,{[k]:e.target.value}));
  const save=e=>{e.preventDefault();
    if(!f.name.trim())return setErr('กรุณากรอกชื่อสาย');
    if(!/^#[0-9a-fA-F]{6}$/.test(f.color))return setErr('สีต้องเป็นรหัส #RRGGBB');
    const hw=Number(f.headway),kmh=Number(f.kmh);
    if(!(hw>=1&&hw<=60))return setErr('ความถี่ต้องอยู่ระหว่าง 1–60 นาที');
    if(!(kmh>=10&&kmh<=120))return setErr('ความเร็วเฉลี่ยต้องอยู่ระหว่าง 10–120 กม./ชม.');
    onSave(Object.assign({},init,{id:init.id||uid('rl'),name:f.name.trim(),en:f.en.trim(),kind:f.kind,color:f.color,headway:hw,kmh:kmh,stations:init.stations||[]}));
  };
  return html`<form className="form" onSubmit=${save}>
    <div className="dh"><h2>${isNew?'เพิ่มสายรถไฟฟ้า':'แก้ไขสายรถไฟฟ้า'}</h2></div>
    <div className="grid2"><div className="field"><label htmlFor="rl-name">ชื่อสาย</label><input id="rl-name" value=${f.name} onChange=${set('name')}/></div>
      <div className="field"><label htmlFor="rl-en">ชื่อภาษาอังกฤษ</label><input id="rl-en" value=${f.en} onChange=${set('en')}/></div></div>
    <div className="grid2"><div className="field"><label htmlFor="rl-kind">ประเภท</label><select id="rl-kind" value=${f.kind} onChange=${set('kind')}>${['BTS','MRT','ARL','SRT'].map(k=>html`<option key=${k} value=${k}>${k}</option>`)}</select></div>
      <div className="field"><label htmlFor="rl-color">สีประจำสาย</label><input id="rl-color" type="color" value=${/^#[0-9a-fA-F]{6}$/.test(f.color)?f.color:'#38BDF8'} onChange=${set('color')}/></div></div>
    <div className="grid2"><div className="field"><label htmlFor="rl-hw">ความถี่ (นาที/ขบวน)</label><input id="rl-hw" inputMode="numeric" value=${f.headway} onChange=${set('headway')}/></div>
      <div className="field"><label htmlFor="rl-kmh">ความเร็วเฉลี่ย (กม./ชม.)</label><input id="rl-kmh" inputMode="numeric" value=${f.kmh} onChange=${set('kmh')}/></div></div>
    <div className="note">เพิ่มสถานีให้สายนี้ได้ที่ “เพิ่ม/แก้ไขสถานี” → เลือกสายและตำแหน่ง (สายต้องมีอย่างน้อย 2 สถานีจึงจะแสดงบนแผนที่)</div>
    ${err&&html`<div className="err" role="alert">${err}</div>`}
    <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}><button className="btn pri" type="submit"><${Icon} n="check" s=${16}/>บันทึกสาย</button><button className="btn" type="button" onClick=${onCancel}>ยกเลิก</button>
      ${!isNew&&html`<${ConfirmButton} label="ลบสายนี้" confirmLabel="ยืนยันลบ" icon="trash" className="btn" onConfirm=${()=>onDelete(init.id)}/>`}</div>
  </form>`;
}

function RailStationEditor({init,lines,stationsById,onSave,onCancel,onDelete,requestPick}){
  const isNew=!init.id;
  const [f,setF]=useState({name:init.name||'',en:init.en||'',lat:init.lat!=null?String(init.lat):'',lon:init.lon!=null?String(init.lon):''});
  const [mem,setMem]=useState(()=>{const m={};lines.forEach(l=>{m[l.id]={on:l.stations.indexOf(init.id)>=0,after:''};});return m;});
  const [err,setErr]=useState('');
  const set=k=>e=>setF(Object.assign({},f,{[k]:e.target.value}));
  const save=e=>{e.preventDefault();
    const lat=Number(f.lat),lon=Number(f.lon);
    if(!f.name.trim())return setErr('กรุณากรอกชื่อสถานี');
    if(!(lat>=BKK_BOX.latMin&&lat<=BKK_BOX.latMax&&lon>=BKK_BOX.lonMin&&lon<=BKK_BOX.lonMax))return setErr('พิกัดต้องอยู่ในกรุงเทพฯและปริมณฑล (ละติจูด '+BKK_BOX.latMin+'–'+BKK_BOX.latMax+', ลองจิจูด '+BKK_BOX.lonMin+'–'+BKK_BOX.lonMax+')');
    if(!lines.some(l=>mem[l.id]&&mem[l.id].on))return setErr('เลือกสายที่สถานีนี้อยู่อย่างน้อย 1 สาย');
    onSave({id:init.id||uid('rs'),name:f.name.trim(),en:f.en.trim(),lat:lat,lon:lon},mem);
  };
  return html`<form className="form" onSubmit=${save}>
    <div className="dh"><h2>${isNew?'เพิ่มสถานีรถไฟฟ้า':'แก้ไขสถานี'}</h2></div>
    <div className="grid2"><div className="field"><label htmlFor="rs-name">ชื่อสถานี</label><input id="rs-name" value=${f.name} onChange=${set('name')}/></div>
      <div className="field"><label htmlFor="rs-en">ชื่อภาษาอังกฤษ</label><input id="rs-en" value=${f.en} onChange=${set('en')}/></div></div>
    <div className="grid2"><div className="field"><label htmlFor="rs-lat">ละติจูด</label><input id="rs-lat" inputMode="decimal" value=${f.lat} onChange=${set('lat')}/></div>
      <div className="field"><label htmlFor="rs-lon">ลองจิจูด</label><input id="rs-lon" inputMode="decimal" value=${f.lon} onChange=${set('lon')}/></div></div>
    <button type="button" className="btn" onClick=${()=>requestPick(p=>setF(x=>Object.assign({},x,{lat:p.lat.toFixed(5),lon:p.lon.toFixed(5)})))}><${Icon} n="pin" s=${16}/>เลือกพิกัดจากแผนที่</button>
    <div className="sec">สายที่ผ่านสถานีนี้</div>
    ${lines.map(l=>{const had=l.stations.indexOf(init.id)>=0,m=mem[l.id]||{on:false,after:''};
      const opts=l.stations.filter((x,i,a)=>a.indexOf(x)===i&&x!==init.id);
      return html`<div key=${l.id} className="mship"><label className="chk"><input type="checkbox" checked=${m.on} aria-label=${l.name} onChange=${e=>{const on=e.target.checked;setMem(x=>Object.assign({},x,{[l.id]:Object.assign({},x[l.id],{on:on})}));}}/><span className="ltag" style=${{background:l.color,color:inkOn(l.color)}}>${l.name}</span></label>
        ${m.on&&!had&&html`<select aria-label=${'ต่อจากสถานีในสาย '+l.name} value=${m.after} onChange=${e=>{const v=e.target.value;setMem(x=>Object.assign({},x,{[l.id]:Object.assign({},x[l.id],{after:v})}));}}>
          <option value="">ต่อท้ายสาย</option>${opts.map(id=>html`<option key=${id} value=${id}>ต่อจาก ${stationsById[id]?stationsById[id].name:id}</option>`)}</select>`}</div>`;})}
    ${err&&html`<div className="err" role="alert">${err}</div>`}
    <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}><button className="btn pri" type="submit"><${Icon} n="check" s=${16}/>บันทึกสถานี</button><button className="btn" type="button" onClick=${onCancel}>ยกเลิก</button>
      ${!isNew&&html`<${ConfirmButton} label="ลบสถานีนี้" confirmLabel="ยืนยันลบ" icon="trash" className="btn" onConfirm=${()=>onDelete(init.id)}/>`}</div>
  </form>`;
}

function RailAdmin({data,setData,toast,requestPick}){
  const rail=data.rail;
  const [edit,setEdit]=useState(null);
  const [q,setQ]=useState('');const [lf,setLf]=useState('all');
  const byId=useMemo(()=>{const m={};rail.stations.forEach(x=>{m[x.id]=x;});return m;},[rail]);
  const upd=fn=>setData(d=>Object.assign({},d,{rail:fn(d.rail)}));
  const upsertLine=l=>{upd(r=>{const a=r.lines.slice(),i=a.findIndex(x=>x.id===l.id);if(i>=0)a[i]=l;else a.push(l);return Object.assign({},r,{lines:a});});setEdit(null);toast('บันทึกสายแล้ว','ok');};
  const delLine=id=>{upd(r=>Object.assign({},r,{lines:r.lines.filter(x=>x.id!==id)}));setEdit(null);toast('ลบสายแล้ว','ok');};
  const blocked=(id,except)=>rail.lines.find(l=>l.stations.indexOf(id)>=0&&(!except||except(l))&&l.stations.filter(x=>x!==id).length<2);
  const saveStation=(st,mem)=>{
    const bad=rail.lines.find(l=>mem[l.id]&&!mem[l.id].on&&l.stations.indexOf(st.id)>=0&&l.stations.filter(x=>x!==st.id).length<2);
    if(bad){toast('สาย '+bad.name+' ต้องมีอย่างน้อย 2 สถานี จึงนำสถานีนี้ออกไม่ได้','bad');return;}
    upd(r=>{
      const stations=r.stations.slice(),i=stations.findIndex(x=>x.id===st.id);
      if(i>=0)stations[i]=Object.assign({},stations[i],st);else stations.push(st);
      const lines=r.lines.map(l=>{
        const m=mem[l.id];if(!m)return l;
        const has=l.stations.indexOf(st.id)>=0;
        if(m.on&&!has){const arr=l.stations.slice(),ai=m.after?arr.indexOf(m.after):-1;if(ai>=0)arr.splice(ai+1,0,st.id);else arr.push(st.id);return Object.assign({},l,{stations:arr});}
        if(!m.on&&has)return Object.assign({},l,{stations:l.stations.filter(x=>x!==st.id)});
        return l;
      });
      return Object.assign({},r,{stations:stations,lines:lines});
    });
    setEdit(null);toast('บันทึกสถานีแล้ว','ok');
  };
  const delStation=id=>{
    const bad=blocked(id);
    if(bad){toast('สาย '+bad.name+' จะเหลือน้อยกว่า 2 สถานี ลบไม่ได้ (แก้สายก่อน)','bad');return;}
    upd(r=>Object.assign({},r,{stations:r.stations.filter(x=>x.id!==id),lines:r.lines.map(l=>Object.assign({},l,{stations:l.stations.filter(x=>x!==id)})),
      links:(r.links||[]).map(g=>g.filter(x=>x!==id)).filter(g=>g.length>1)}));
    setEdit(null);toast('ลบสถานีแล้ว','ok');
  };
  if(edit&&edit.t==='line')return html`<${LineEditor} init=${edit.item} onSave=${upsertLine} onCancel=${()=>setEdit(null)} onDelete=${delLine}/>`;
  if(edit&&edit.t==='station')return html`<${RailStationEditor} init=${edit.item} lines=${rail.lines} stationsById=${byId} onSave=${saveStation} onCancel=${()=>setEdit(null)} onDelete=${delStation} requestPick=${requestPick}/>`;
  const nq=norm(q);
  const inLine=lf==='all'?null:(rail.lines.find(l=>l.id===lf)||{stations:[]}).stations;
  const sts=rail.stations.filter(x=>(!inLine||inLine.indexOf(x.id)>=0)&&(!nq||norm(x.name+' '+(x.en||'')).indexOf(nq)>=0));
  return html`<${React.Fragment}>
    <div className="sec">สายรถไฟฟ้า (${rail.lines.length})</div>
    <button className="btn pri" onClick=${()=>setEdit({t:'line',item:{}})}><${Icon} n="plus" s=${16}/>เพิ่มสายรถไฟฟ้า</button>
    ${rail.lines.map(l=>html`<div key=${l.id} className="row" style=${{cursor:'default'}}><span className="ltag" style=${{background:l.color,color:inkOn(l.color),flex:'none'}}>${l.kind}</span>
      <div className="mid"><div className="t1">${l.name}</div><div className="t2">${l.stations.filter((x,i,a)=>a.indexOf(x)===i).length} สถานี · ทุก ${l.headway} นาที</div></div>
      <button className="btn sm" onClick=${()=>setEdit({t:'line',item:l})}><${Icon} n="edit" s=${14}/>แก้ไข</button></div>`)}
    <div className="sec">สถานี (${sts.length})</div>
    <button className="btn pri" onClick=${()=>setEdit({t:'station',item:{}})}><${Icon} n="plus" s=${16}/>เพิ่มสถานีรถไฟฟ้า</button>
    <div style=${{display:'flex',gap:8}}>
      <label className="search" style=${{flex:1,height:36}}><${Icon} n="search"/><span className="sr">ค้นหาสถานี</span><input id="q-rail-admin" type="search" placeholder="ค้นหาสถานี" value=${q} onChange=${e=>setQ(e.target.value)}/></label>
      <select className="sel" aria-label="กรองตามสาย" value=${lf} onChange=${e=>setLf(e.target.value)}><option value="all">ทุกสาย</option>${rail.lines.map(l=>html`<option key=${l.id} value=${l.id}>${l.name}</option>`)}</select></div>
    ${sts.slice(0,80).map(x=>html`<div key=${x.id} className="row" style=${{cursor:'default'}}><span style=${{color:'var(--sky)',flex:'none'}}><${Icon} n="train" s=${20}/></span>
      <div className="mid"><div className="t1">${x.name}</div><div className="t2">${x.lat.toFixed(4)}, ${x.lon.toFixed(4)} · ${rail.lines.filter(l=>l.stations.indexOf(x.id)>=0).map(l=>l.name).slice(0,2).join(', ')||'ไม่มีสาย'}</div></div>
      <button className="btn sm" onClick=${()=>setEdit({t:'station',item:x})}><${Icon} n="edit" s=${14}/>แก้ไข</button></div>`)}

function AdminLogin({onDone,toast}){
  const [st,setSt]=useState(null);const [pw,setPw]=useState('');const [pw2,setPw2]=useState('');const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
  useEffect(()=>{Auth.status().then(setSt).catch(()=>setSt({configured:false}));},[]);
  if(!st)return html`<div className="panel-body"><div className="empty">กำลังตรวจสอบ…</div></div>`;
  const setup=!st.configured;
  const submit=async e=>{
    e.preventDefault();setErr('');
    if(setup&&pw!==pw2){setErr('รหัสผ่านสองช่องไม่ตรงกัน');return;}
    setBusy(true);
    try{
      let r=setup?await Auth.setup(pw):null;
      if(setup&&!(r&&r.ok)){setErr((r&&r.error)||'ตั้งรหัสผ่านไม่สำเร็จ');setBusy(false);return;}
      r=await Auth.login(pw);
      if(r&&r.ok){toast(setup?'ตั้งรหัสผ่านแอดมินแล้ว':'เข้าสู่ระบบแอดมินแล้ว','ok');onDone();}else setErr((r&&r.error)||'เข้าสู่ระบบไม่สำเร็จ');
    }catch(x){setErr('เกิดข้อผิดพลาด: '+(x&&x.message||x));}
    setBusy(false);
  };
  return html`<div className="panel-body">
    <div className="dh"><span style=${{color:'var(--sky)'}}><${Icon} n="shield" s=${30}/></span><div><h2>${setup?'ตั้งรหัสผ่านแอดมิน':'เข้าสู่ระบบแอดมิน'}</h2><div className="sub">เฉพาะแอดมินเท่านั้นที่แก้ไขข้อมูลเดินรถได้</div></div></div>
    <form className="form" onSubmit=${submit}>
      <div className="field"><label htmlFor="adm-pw">รหัสผ่าน${setup?' (อย่างน้อย 8 ตัวอักษร)':''}</label><input id="adm-pw" type="password" autoComplete=${setup?'new-password':'current-password'} value=${pw} onChange=${e=>setPw(e.target.value)} required/></div>
      ${setup&&html`<div className="field"><label htmlFor="adm-pw2">ยืนยันรหัสผ่าน</label><input id="adm-pw2" type="password" autoComplete="new-password" value=${pw2} onChange=${e=>setPw2(e.target.value)} required/></div>`}
      ${err&&html`<div className="err" role="alert">${err}</div>`}
      <button className="btn pri wide" type="submit" disabled=${busy}><${Icon} n="lock" s=${16}/>${busy?'กำลังตรวจสอบ…':setup?'ตั้งรหัสผ่านและเข้าสู่ระบบ':'เข้าสู่ระบบ'}</button>
    </form>
    ${!SYS&&html`<div className="note warn">โหมดสาธิตบนเว็บ: รหัสผ่านถูกเก็บแบบแฮชในเบราว์เซอร์นี้เท่านั้น ใครแก้ไขข้อมูลในเครื่องของตัวเองได้ และไม่แชร์ไปยังผู้ใช้คนอื่น การบังคับสิทธิ์จริงต้องทำที่เซิร์ฟเวอร์ (ในแอป Desktop ตรวจสิทธิ์ที่ main process)</div>`}
  </div>`;
}

    setData(d=>{const arr=d[key].slice(),i=arr.findIndex(x=>x.id===item.id);if(i>=0)arr[i]=item;else arr.push(item);return Object.assign({},d,{[key]:arr});});
