    <div className="gcard"><h3><span className="n">4</span>เช็กเวลาและสถานะรถมาถึง (Real-time ETA)</h3>
      <ul><li>เลือกสายรถเมล์ → ดูเวลานับถอยหลังของแต่ละป้าย รถที่กำลังวิ่งพร้อมทะเบียน ความเร็ว และความหนาแน่น (ว่าง/ปานกลาง/แน่น)</li>
        <li>แตะรถบนแผนที่เพื่อติดตามคันนั้น กดรูประฆังที่ป้ายเพื่อให้แจ้งเตือนก่อนรถถึง และกดดาวเพื่อเก็บเป็นรายการโปรด</li>
        <li>รถไฟฟ้า: หน้าสถานีแสดง “ขบวนถัดไป” ของแต่ละทิศ</li></ul>
      <button className="btn sm go" onClick=${()=>go('routes')}><${Icon} n="bus" s=${14}/>ไปที่ สายรถ</button></div>
    <div className="note"><b>เกี่ยวกับข้อมูล:</b> ตำแหน่งรถและเวลาขบวนเป็นค่าจำลอง ไม่ใช่ข้อมูลเรียลไทม์จริง รายชื่อ/ลำดับ/พิกัดสถานีรถไฟฟ้าและป้ายรถเมล์เป็นค่าประมาณ ตรวจสอบกับข้อมูลทางการ (เช่น GTFS) ก่อนใช้งานจริง ผู้ดูแลแก้ไขได้ที่แท็บแอดมิน</div>
  </div>`;
}

/* ---------- แอดมิน: จัดการสถานีรถไฟฟ้า / สาย ---------- */
function LineEditor({init,onSave,onCancel,onDelete}){
  const isNew=!init.id;
  const [f,setF]=useState({name:init.name||'',en:init.en||'',kind:init.kind||'MRT',color:init.color||'#38BDF8',headway:String(init.headway||6),kmh:String(init.kmh||34)});
  const [err,setErr]=useState('');
  const set=k=>e=>setF(Object.assign({},f,{[k]:e.target.value}));
  const save=e=>{e.preventDefault();
    if(!f.name.trim())return setErr('กรุณากรอกชื่อสาย');
    if(!/^#[0-9a-fA-F]{6}$/.test(f.color))return setErr('สีต้องเป็นรหัส #RRGGBB');
    const hw=Number(f.headway),kmh=Number(f.kmh);
    if(!(hw>=1&&hw<=60))return setErr('ความถี่ต้องอยู่ระหว่าง 1–60 นาที');
    if(!(kmh>=10&&kmh<=120))return setErr('ความเร็วเฉลี่ยต้องอยู่ระหว่าง 10–120 กม./ชม.');
    onSave(Object.assign({},init,{id:init.id||uid('rl'),name:f.name.trim(),en:f.en.trim(),kind:f.kind,color:f.color,headway:hw,kmh:kmh,stations:init.stations||[]}));
  };
  return html`<form className="form" onSubmit=${save}>
    <div className="dh"><h2>${isNew?'เพิ่มสายรถไฟฟ้า':'แก้ไขสายรถไฟฟ้า'}</h2></div>
    <div className="grid2"><div className="field"><label htmlFor="rl-name">ชื่อสาย</label><input id="rl-name" value=${f.name} onChange=${set('name')}/></div>
      <div className="field"><label htmlFor="rl-en">ชื่อภาษาอังกฤษ</label><input id="rl-en" value=${f.en} onChange=${set('en')}/></div></div>
    <div className="grid2"><div className="field"><label htmlFor="rl-kind">ประเภท</label><select id="rl-kind" value=${f.kind} onChange=${set('kind')}>${['BTS','MRT','ARL','SRT'].map(k=>html`<option key=${k} value=${k}>${k}</option>`)}</select></div>
      <div className="field"><label htmlFor="rl-color">สีประจำสาย</label><input id="rl-color" type="color" value=${/^#[0-9a-fA-F]{6}$/.test(f.color)?f.color:'#38BDF8'} onChange=${set('color')}/></div></div>
    <div className="grid2"><div className="field"><label htmlFor="rl-hw">ความถี่ (นาที/ขบวน)</label><input id="rl-hw" inputMode="numeric" value=${f.headway} onChange=${set('headway')}/></div>
      <div className="field"><label htmlFor="rl-kmh">ความเร็วเฉลี่ย (กม./ชม.)</label><input id="rl-kmh" inputMode="numeric" value=${f.kmh} onChange=${set('kmh')}/></div></div>
    <div className="note">เพิ่มสถานีให้สายนี้ได้ที่ “เพิ่ม/แก้ไขสถานี” → เลือกสายและตำแหน่ง (สายต้องมีอย่างน้อย 2 สถานีจึงจะแสดงบนแผนที่)</div>
    ${err&&html`<div className="err" role="alert">${err}</div>`}
    <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}><button className="btn pri" type="submit"><${Icon} n="check" s=${16}/>บันทึกสาย</button><button className="btn" type="button" onClick=${onCancel}>ยกเลิก</button>
      ${!isNew&&html`<${ConfirmButton} label="ลบสายนี้" confirmLabel="ยืนยันลบ" icon="trash" className="btn" onConfirm=${()=>onDelete(init.id)}/>`}</div>
  </form>`;
}

function RailStationEditor({init,lines,stationsById,onSave,onCancel,onDelete,requestPick}){
  const isNew=!init.id;
  const [f,setF]=useState({name:init.name||'',en:init.en||'',lat:init.lat!=null?String(init.lat):'',lon:init.lon!=null?String(init.lon):''});
  const [mem,setMem]=useState(()=>{const m={};lines.forEach(l=>{m[l.id]={on:l.stations.indexOf(init.id)>=0,after:''};});return m;});
  const [err,setErr]=useState('');
  const set=k=>e=>setF(Object.assign({},f,{[k]:e.target.value}));
  const save=e=>{e.preventDefault();
    const lat=Number(f.lat),lon=Number(f.lon);
    if(!f.name.trim())return setErr('กรุณากรอกชื่อสถานี');
    if(!(lat>=BKK_BOX.latMin&&lat<=BKK_BOX.latMax&&lon>=BKK_BOX.lonMin&&lon<=BKK_BOX.lonMax))return setErr('พิกัดต้องอยู่ในกรุงเทพฯและปริมณฑล (ละติจูด '+BKK_BOX.latMin+'–'+BKK_BOX.latMax+', ลองจิจูด '+BKK_BOX.lonMin+'–'+BKK_BOX.lonMax+')');
    if(!lines.some(l=>mem[l.id]&&mem[l.id].on))return setErr('เลือกสายที่สถานีนี้อยู่อย่างน้อย 1 สาย');
    onSave({id:init.id||uid('rs'),name:f.name.trim(),en:f.en.trim(),lat:lat,lon:lon},mem);
  };
  return html`<form className="form" onSubmit=${save}>
    <div className="dh"><h2>${isNew?'เพิ่มสถานีรถไฟฟ้า':'แก้ไขสถานี'}</h2></div>
    <div className="grid2"><div className="field"><label htmlFor="rs-name">ชื่อสถานี</label><input id="rs-name" value=${f.name} onChange=${set('name')}/></div>
      <div className="field"><label htmlFor="rs-en">ชื่อภาษาอังกฤษ</label><input id="rs-en" value=${f.en} onChange=${set('en')}/></div></div>
    <div className="grid2"><div className="field"><label htmlFor="rs-lat">ละติจูด</label><input id="rs-lat" inputMode="decimal" value=${f.lat} onChange=${set('lat')}/></div>
      <div className="field"><label htmlFor="rs-lon">ลองจิจูด</label><input id="rs-lon" inputMode="decimal" value=${f.lon} onChange=${set('lon')}/></div></div>
    <button type="button" className="btn" onClick=${()=>requestPick(p=>setF(x=>Object.assign({},x,{lat:p.lat.toFixed(5),lon:p.lon.toFixed(5)})))}><${Icon} n="pin" s=${16}/>เลือกพิกัดจากแผนที่</button>
    <div className="sec">สายที่ผ่านสถานีนี้</div>
    ${lines.map(l=>{const had=l.stations.indexOf(init.id)>=0,m=mem[l.id]||{on:false,after:''};
      const opts=l.stations.filter((x,i,a)=>a.indexOf(x)===i&&x!==init.id);
      return html`<div key=${l.id} className="mship"><label className="chk"><input type="checkbox" checked=${m.on} aria-label=${l.name} onChange=${e=>{const on=e.target.checked;setMem(x=>Object.assign({},x,{[l.id]:Object.assign({},x[l.id],{on:on})}));}}/><span className="ltag" style=${{background:l.color,color:inkOn(l.color)}}>${l.name}</span></label>
        ${m.on&&!had&&html`<select aria-label=${'ต่อจากสถานีในสาย '+l.name} value=${m.after} onChange=${e=>{const v=e.target.value;setMem(x=>Object.assign({},x,{[l.id]:Object.assign({},x[l.id],{after:v})}));}}>
          <option value="">ต่อท้ายสาย</option>${opts.map(id=>html`<option key=${id} value=${id}>ต่อจาก ${stationsById[id]?stationsById[id].name:id}</option>`)}</select>`}</div>`;})}
    ${err&&html`<div className="err" role="alert">${err}</div>`}
    <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}><button className="btn pri" type="submit"><${Icon} n="check" s=${16}/>บันทึกสถานี</button><button className="btn" type="button" onClick=${onCancel}>ยกเลิก</button>
      ${!isNew&&html`<${ConfirmButton} label="ลบสถานีนี้" confirmLabel="ยืนยันลบ" icon="trash" className="btn" onConfirm=${()=>onDelete(init.id)}/>`}</div>
  </form>`;
}

function RailAdmin({data,setData,toast,requestPick}){
  const rail=data.rail;
  const [edit,setEdit]=useState(null);
  const [q,setQ]=useState('');const [lf,setLf]=useState('all');
  const byId=useMemo(()=>{const m={};rail.stations.forEach(x=>{m[x.id]=x;});return m;},[rail]);
  const upd=fn=>setData(d=>Object.assign({},d,{rail:fn(d.rail)}));
  const upsertLine=l=>{upd(r=>{const a=r.lines.slice(),i=a.findIndex(x=>x.id===l.id);if(i>=0)a[i]=l;else a.push(l);return Object.assign({},r,{lines:a});});setEdit(null);toast('บันทึกสายแล้ว','ok');};
  const delLine=id=>{upd(r=>Object.assign({},r,{lines:r.lines.filter(x=>x.id!==id)}));setEdit(null);toast('ลบสายแล้ว','ok');};
  const blocked=(id,except)=>rail.lines.find(l=>l.stations.indexOf(id)>=0&&(!except||except(l))&&l.stations.filter(x=>x!==id).length<2);
  const saveStation=(st,mem)=>{
    const bad=rail.lines.find(l=>mem[l.id]&&!mem[l.id].on&&l.stations.indexOf(st.id)>=0&&l.stations.filter(x=>x!==st.id).length<2);
    if(bad){toast('สาย '+bad.name+' ต้องมีอย่างน้อย 2 สถานี จึงนำสถานีนี้ออกไม่ได้','bad');return;}
    upd(r=>{
      const stations=r.stations.slice(),i=stations.findIndex(x=>x.id===st.id);
      if(i>=0)stations[i]=Object.assign({},stations[i],st);else stations.push(st);
      const lines=r.lines.map(l=>{
        const m=mem[l.id];if(!m)return l;
        const has=l.stations.indexOf(st.id)>=0;
        if(m.on&&!has){const arr=l.stations.slice(),ai=m.after?arr.indexOf(m.after):-1;if(ai>=0)arr.splice(ai+1,0,st.id);else arr.push(st.id);return Object.assign({},l,{stations:arr});}
        if(!m.on&&has)return Object.assign({},l,{stations:l.stations.filter(x=>x!==st.id)});
        return l;
      });
      return Object.assign({},r,{stations:stations,lines:lines});
    });
    setEdit(null);toast('บันทึกสถานีแล้ว','ok');
  };
  const delStation=id=>{
    const bad=blocked(id);
    if(bad){toast('สาย '+bad.name+' จะเหลือน้อยกว่า 2 สถานี ลบไม่ได้ (แก้สายก่อน)','bad');return;}
    upd(r=>Object.assign({},r,{stations:r.stations.filter(x=>x.id!==id),lines:r.lines.map(l=>Object.assign({},l,{stations:l.stations.filter(x=>x!==id)})),
      links:(r.links||[]).map(g=>g.filter(x=>x!==id)).filter(g=>g.length>1)}));
    setEdit(null);toast('ลบสถานีแล้ว','ok');
  };
  if(edit&&edit.t==='line')return html`<${LineEditor} init=${edit.item} onSave=${upsertLine} onCancel=${()=>setEdit(null)} onDelete=${delLine}/>`;
  if(edit&&edit.t==='station')return html`<${RailStationEditor} init=${edit.item} lines=${rail.lines} stationsById=${byId} onSave=${saveStation} onCancel=${()=>setEdit(null)} onDelete=${delStation} requestPick=${requestPick}/>`;
  const nq=norm(q);
  const inLine=lf==='all'?null:(rail.lines.find(l=>l.id===lf)||{stations:[]}).stations;
  const sts=rail.stations.filter(x=>(!inLine||inLine.indexOf(x.id)>=0)&&(!nq||norm(x.name+' '+(x.en||'')).indexOf(nq)>=0));
  return html`<${React.Fragment}>
    <div className="sec">สายรถไฟฟ้า (${rail.lines.length})</div>
    <button className="btn pri" onClick=${()=>setEdit({t:'line',item:{}})}><${Icon} n="plus" s=${16}/>เพิ่มสายรถไฟฟ้า</button>
    ${rail.lines.map(l=>html`<div key=${l.id} className="row" style=${{cursor:'default'}}><span className="ltag" style=${{background:l.color,color:inkOn(l.color),flex:'none'}}>${l.kind}</span>
      <div className="mid"><div className="t1">${l.name}</div><div className="t2">${l.stations.filter((x,i,a)=>a.indexOf(x)===i).length} สถานี · ทุก ${l.headway} นาที</div></div>
      <button className="btn sm" onClick=${()=>setEdit({t:'line',item:l})}><${Icon} n="edit" s=${14}/>แก้ไข</button></div>`)}
    <div className="sec">สถานี (${sts.length})</div>
    <button className="btn pri" onClick=${()=>setEdit({t:'station',item:{}})}><${Icon} n="plus" s=${16}/>เพิ่มสถานีรถไฟฟ้า</button>
    <div style=${{display:'flex',gap:8}}>
      <label className="search" style=${{flex:1,height:36}}><${Icon} n="search"/><span className="sr">ค้นหาสถานี</span><input id="q-rail-admin" type="search" placeholder="ค้นหาสถานี" value=${q} onChange=${e=>setQ(e.target.value)}/></label>
      <select className="sel" aria-label="กรองตามสาย" value=${lf} onChange=${e=>setLf(e.target.value)}><option value="all">ทุกสาย</option>${rail.lines.map(l=>html`<option key=${l.id} value=${l.id}>${l.name}</option>`)}</select></div>
    ${sts.slice(0,80).map(x=>html`<div key=${x.id} className="row" style=${{cursor:'default'}}><span style=${{color:'var(--sky)',flex:'none'}}><${Icon} n="train" s=${20}/></span>
      <div className="mid"><div className="t1">${x.name}</div><div className="t2">${x.lat.toFixed(4)}, ${x.lon.toFixed(4)} · ${rail.lines.filter(l=>l.stations.indexOf(x.id)>=0).map(l=>l.name).slice(0,2).join(', ')||'ไม่มีสาย'}</div></div>
      <button className="btn sm" onClick=${()=>setEdit({t:'station',item:x})}><${Icon} n="edit" s=${14}/>แก้ไข</button></div>`)}

function AdminLogin({onDone,toast}){
  const [st,setSt]=useState(null);const [pw,setPw]=useState('');const [pw2,setPw2]=useState('');const [err,setErr]=useState('');const [busy,setBusy]=useState(false);
  useEffect(()=>{Auth.status().then(setSt).catch(()=>setSt({configured:false}));},[]);
  if(!st)return html`<div className="panel-body"><div className="empty">กำลังตรวจสอบ…</div></div>`;
  const setup=!st.configured;
  const submit=async e=>{
    e.preventDefault();setErr('');
    if(setup&&pw!==pw2){setErr('รหัสผ่านสองช่องไม่ตรงกัน');return;}
    setBusy(true);
    try{
      let r=setup?await Auth.setup(pw):null;
      if(setup&&!(r&&r.ok)){setErr((r&&r.error)||'ตั้งรหัสผ่านไม่สำเร็จ');setBusy(false);return;}
      r=await Auth.login(pw);
      if(r&&r.ok){toast(setup?'ตั้งรหัสผ่านแอดมินแล้ว':'เข้าสู่ระบบแอดมินแล้ว','ok');onDone();}else setErr((r&&r.error)||'เข้าสู่ระบบไม่สำเร็จ');
    }catch(x){setErr('เกิดข้อผิดพลาด: '+(x&&x.message||x));}
    setBusy(false);
  };
  return html`<div className="panel-body">
    <div className="dh"><span style=${{color:'var(--sky)'}}><${Icon} n="shield" s=${30}/></span><div><h2>${setup?'ตั้งรหัสผ่านแอดมิน':'เข้าสู่ระบบแอดมิน'}</h2><div className="sub">เฉพาะแอดมินเท่านั้นที่แก้ไขข้อมูลเดินรถได้</div></div></div>
    <form className="form" onSubmit=${submit}>
      <div className="field"><label htmlFor="adm-pw">รหัสผ่าน${setup?' (อย่างน้อย 8 ตัวอักษร)':''}</label><input id="adm-pw" type="password" autoComplete=${setup?'new-password':'current-password'} value=${pw} onChange=${e=>setPw(e.target.value)} required/></div>
      ${setup&&html`<div className="field"><label htmlFor="adm-pw2">ยืนยันรหัสผ่าน</label><input id="adm-pw2" type="password" autoComplete="new-password" value=${pw2} onChange=${e=>setPw2(e.target.value)} required/></div>`}
      ${err&&html`<div className="err" role="alert">${err}</div>`}
      <button className="btn pri wide" type="submit" disabled=${busy}><${Icon} n="lock" s=${16}/>${busy?'กำลังตรวจสอบ…':setup?'ตั้งรหัสผ่านและเข้าสู่ระบบ':'เข้าสู่ระบบ'}</button>
    </form>
    ${!SYS&&html`<div className="note warn">โหมดสาธิตบนเว็บ: รหัสผ่านถูกเก็บแบบแฮชในเบราว์เซอร์นี้เท่านั้น ใครแก้ไขข้อมูลในเครื่องของตัวเองได้ และไม่แชร์ไปยังผู้ใช้คนอื่น การบังคับสิทธิ์จริงต้องทำที่เซิร์ฟเวอร์ (ในแอป Desktop ตรวจสิทธิ์ที่ main process)</div>`}
  </div>`;
}

    setData(d=>{const arr=d[key].slice(),i=arr.findIndex(x=>x.id===item.id);if(i>=0)arr[i]=item;else arr.push(item);return Object.assign({},d,{[key]:arr});});

  };
  const exportJson=()=>{
    const txt=JSON.stringify(data,null,2);
    try{navigator.clipboard.writeText(txt).then(()=>toast('คัดลอกข้อมูล JSON แล้ว','ok'),()=>toast('คัดลอกไม่ได้ในหน้านี้','bad'));}catch(e){toast('คัดลอกไม่ได้ในหน้านี้','bad');}
  };
  const tab=(k,l)=>html`<button className=${'tab'+(sub===k?' on':'')} onClick=${()=>{setSub(k);setEdit(null);}}><span>${l}</span></button>`;
  return html`<${React.Fragment}>
    <div className="panel-head">
      <div className="dh"><span style=${{color:'var(--sky)'}}><${Icon} n="shield" s=${26}/></span><div style=${{flex:1}}><h2>ศูนย์จัดการระบบเดินรถ</h2><div className="sub">${net.routes.length} สาย · ${data.stops.length} ป้าย</div></div>
        <button className="btn sm" onClick=${logout}>ออกจากระบบ</button></div>
      <div className="tabs">${tab('routes','สายรถ')}${tab('stops','ป้ายรถเมล์')}${tab('rail','รถไฟฟ้า')}${tab('sys','เครื่องมือระบบ')}</div>
    </div>
    <div className="panel-body">
      ${sub==='routes'&&(edit?html`<${RouteEditor} init=${edit} stops=${data.stops} onSave=${r=>upsert('routes',r)} onCancel=${()=>setEdit(null)} onDelete=${delRoute}/>`:html`<${React.Fragment}>
        <button className="btn pri" onClick=${()=>setEdit({})}><${Icon} n="plus" s=${16}/>เพิ่มสายรถเมล์</button>
        ${data.routes.map(r=>html`<div key=${r.id} className="row" style=${{cursor:'default'}}>
          <span className="rno" style=${{background:(TYPES[r.type]||TYPES.ac).color}}>${r.no}</span>
          <div className="mid"><div className="t1">${r.name||(()=>{const a=data.stops.find(s=>s.id===r.stops[0]),b=data.stops.find(s=>s.id===r.stops[r.stops.length-1]);return (a?a.name:'?')+' – '+(b?b.name:'?');})()}</div><div className="t2">${r.stops.length} ป้าย · ถี่ทุก ${r.headway} นาที · ฿${r.fare}</div></div>
          <button className="btn sm" onClick=${()=>setEdit(r)}><${Icon} n="edit" s=${14}/>แก้ไข</button></div>`)}
      <//>`)}
      ${sub==='stops'&&(edit?html`<${StopEditor} init=${edit} provinces=${provinces} onSave=${s=>upsert('stops',s)} onCancel=${()=>setEdit(null)} onDelete=${delStop} requestPick=${requestPick}/>`:html`<${React.Fragment}>
        <button className="btn pri" onClick=${()=>setEdit({})}><${Icon} n="plus" s=${16}/>เพิ่มป้ายรถเมล์</button>
        ${data.stops.map(s=>html`<div key=${s.id} className="row" style=${{cursor:'default'}}>
          <span style=${{color:'var(--sky)',flex:'none'}}><${Icon} n="pin" s=${20}/></span>
          <div className="mid"><div className="t1">${s.name}</div><div className="t2">${s.province} · ${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}</div></div>
          <button className="btn sm" onClick=${()=>setEdit(s)}><${Icon} n="edit" s=${14}/>แก้ไข</button></div>`)}
      <//>`)}
      ${sub==='rail'&&html`<${RailAdmin} data=${data} setData=${setData} toast=${toast} requestPick=${requestPick}/>`}
      ${sub==='sys'&&html`<${SysPanel} toast=${toast}/>`}
      ${sub!=='sys'&&!edit&&html`<div className="sec">ข้อมูล</div>
        <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}><button className="btn sm" onClick=${exportJson}><${Icon} n="copy" s=${14}/>คัดลอกข้อมูลเป็น JSON</button>
        <${ConfirmButton} className="btn sm" label="คืนค่าข้อมูลตัวอย่าง" confirmLabel="ยืนยันคืนค่า" onConfirm=${resetData}/></div>
        <div className="note">ข้อมูลที่แก้ไขเก็บในเบราว์เซอร์/แอปเครื่องนี้ และเริ่มใช้กับแผนที่ทันที ส่วนรถเมล์บนแผนที่เป็นการจำลองจากความถี่ของแต่ละสาย</div>`}
    </div>
  <//>`;
}

/* ================================ app ================================ */
function App(){
  const [data,setDataRaw]=useState(loadData);
  const setData=fn=>setDataRaw(d=>{const n=typeof fn==='function'?fn(d):fn;store.set(DATA_KEY,n);return n;});
  const [roadsOnline,setRoadsOnlineS]=useState(()=>store.get('bustime.roadsOnline',false)===true);
  const setRoadsOnline=v=>{setRoadsOnlineS(v);store.set('bustime.roadsOnline',v);};
  const [roads,retryRoads]=useRoads(data,roadsOnline);
  const net=useMemo(()=>buildNet(data,roads),[data,roads]);
  const rn=useMemo(()=>buildRail(data.rail),[data.rail]);
  const [theme,setThemeState]=useState(()=>{const t=store.get('bustime.theme',null)==='dark'?'dark':'light';try{document.documentElement.setAttribute('data-theme',t);}catch(e){}return t;});
  const setTheme=t=>{try{const h=document.documentElement;h.classList.add('theming');setTimeout(()=>h.classList.remove('theming'),500);}catch(e){}setThemeState(t);store.set('bustime.theme',t);try{document.documentElement.setAttribute('data-theme',t);}catch(e){}};
  const [layers,setLayers]=useState({bus:true,rail:true});
  const [mapModeS,setMapModeS]=useState(()=>store.get('bustime.mapmode','default')==='transit'?'transit':'default');
  const mapMode=mapModeS==='transit'?'transit':theme==='dark'?'dark':'default';
  const setMapMode=m=>{
    if(m==='transit'){setMapModeS('transit');store.set('bustime.mapmode','transit');setLayers({bus:true,rail:true});return;}
    setMapModeS('default');store.set('bustime.mapmode','default');
    const t=m==='dark'?'dark':'light';if(t!==theme)setTheme(t);
  };
  const [plan,setPlan]=useState({from:null,to:null,sel:0});
  const [dirOpen,setDirOpen]=useState(false);
  const planResults=useMemo(()=>plan.from&&plan.to?planTrips(net,rn,plan.from,plan.to):[],[net,rn,plan.from,plan.to]);
  const clock=useRef({real:Date.now(),sim:Date.now()/1000,scale:1});
  const [simT,setSimT]=useState(Date.now()/1000);
  const [scale,setScaleState]=useState(1);
  useEffect(()=>{
    const id=setInterval(()=>{const c=clock.current;setSimT(c.sim+(Date.now()-c.real)/1000*c.scale);},1000);
    return()=>clearInterval(id);
  },[]);
  const setScale=v=>{const c=clock.current,now=Date.now();c.sim=c.sim+(now-c.real)/1000*c.scale;c.real=now;c.scale=v;setScaleState(v);};
  const sim=useMemo(()=>simulate(net,simT),[net,simT]);

  const [tab,setTab]=useState('routes');
  const [view,setView]=useState({kind:'list'});
  const [focusStop,setFocusStop]=useState(null);
  const [selBusId,setSelBusId]=useState(null);
  const [follow,setFollow]=useState(false);
  const [favs,setFavs]=useState(()=>store.get('bustime.favs',{routes:['r29'],stops:['mc']}));
  const [alerts,setAlerts]=useState(()=>store.get('bustime.alerts',[]));
  const [admin,setAdmin]=useState(false);
  const [toasts,setToasts]=useState([]);
  const [userLoc,setUserLoc]=useState(null);
  const [locating,setLocating]=useState(false);
  const [picking,setPicking]=useState(false);
  const [draftPin,setDraftPin]=useState(null);
  const pickCb=useRef(null);
  const fired=useRef({});

  const bkk=useMemo(()=>boundsOf(net.stopList.concat(rn.list)),[net,rn]);
  const [fitReq,setFitReq]=useState({key:0,view:THON_VIEW,instant:true});
  const fitKey=useRef(1);
  const requestFit=r=>setFitReq(Object.assign({key:fitKey.current++},r));

  useEffect(()=>{setDraftPin(null);},[data]);
  useEffect(()=>{store.set('bustime.favs',favs);},[favs]);
  useEffect(()=>{store.set('bustime.alerts',alerts);},[alerts]);

  const toast=(msg,kind)=>{const id=uid('t');setToasts(t=>t.concat({id:id,msg:msg,kind:kind}).slice(-3));setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),kind==='bad'?6000:4000);};
  const toggleFav=(k,id)=>setFavs(f=>{const a=f[k].indexOf(id)>=0?f[k].filter(x=>x!==id):f[k].concat(id);return Object.assign({},f,{[k]:a});});
  const toggleAlert=(stopId,routeId,d)=>{
    const key=stopId+'|'+routeId+'|'+d;
    const has=alerts.some(a=>a.key===key);
    if(has){setAlerts(alerts.filter(a=>a.key!==key));toast('ยกเลิกการแจ้งเตือนแล้ว');}
    else{
      setAlerts(alerts.concat({key:key,stopId:stopId,routeId:routeId,d:d,mins:3}));
      toast('จะแจ้งเตือนเมื่อรถเหลือ 3 นาที (ปรับได้ที่แท็บโปรด)','ok');
      try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission();}catch(e){}
    }
  };
  const setAlertMins=(key,m)=>setAlerts(alerts.map(a=>a.key===key?Object.assign({},a,{mins:m}):a));
  const removeAlert=key=>setAlerts(alerts.filter(a=>a.key!==key));

  // fire alerts
  useEffect(()=>{
    alerts.forEach(a=>{
      const rt=net.routeById[a.routeId];if(!rt)return;
      const idx=rt.geo[a.d].ids.indexOf(a.stopId);if(idx<0||idx===rt.geo[a.d].ids.length-1)return;
      const first=arrivalsAt(sim,rt,a.d,idx)[0];if(!first)return;
      if(first.eta<=a.mins*60){
        const k=first.bus.id+':'+first.lapKey;
        if(fired.current[a.key]!==k){
          fired.current[a.key]=k;
          const st=net.stopsById[a.stopId];
          const msg='รถสาย '+rt.no+' ใกล้ถึงป้าย'+st.name+' · '+etaParts(first.eta,first.delta).text;
          toast(msg,'ok');
          try{if(window.Notification&&Notification.permission==='granted')new Notification('BUS TIME',{body:msg});}catch(e){}
        }
      }
    });
  },[sim]);

  const selRt=view.kind==='route'?net.routeById[view.id]:null;
  const selBus=selBusId?sim.buses.find(b=>b.id===selBusId)||null:null;

  const openRoute=(id,dir)=>{
    const rt=net.routeById[id];if(!rt)return;
    setTab(t=>t==='admin'?'routes':t);
    setView({kind:'route',id:id,dir:dir||'out'});setFocusStop(null);setSelBusId(null);setFollow(false);
    requestFit({bounds:boundsOf(rt.geo.out.pp)});
  };
  const openStop=id=>{
    const s=net.stopsById[id];if(!s)return;
    setView({kind:'stop',id:id});setFocusStop(id);setSelBusId(null);setFollow(false);
    requestFit({center:{x:s.x,y:s.y},k:0.03});
  };
  const focusOnStop=id=>{const s=net.stopsById[id];if(!s)return;setFocusStop(id);requestFit({center:{x:s.x,y:s.y},k:0.03});};
  const onBus=id=>{
    const b=sim.buses.find(x=>x.id===id);if(!b)return;
    setTab(t=>t==='admin'?'routes':t);
    if(!(view.kind==='route'&&view.id===b.rt.id))setView({kind:'route',id:b.rt.id,dir:b.d});
    else if(view.dir!==b.d)setView({kind:'route',id:b.rt.id,dir:b.d});
    setSelBusId(id);setFollow(true);
  };
  const openLine=id=>{
    const ln=rn.lineById[id];if(!ln)return;
    setTab('rail');setView({kind:'line',id:id});setFocusStop(null);setSelBusId(null);setFollow(false);
    setLayers(l=>l.rail?l:Object.assign({},l,{rail:true}));
    requestFit({bounds:boundsOf(ln.ids.map(i=>rn.stations[i]))});
  };
  const openStation=id=>{
    const st=rn.stations[id];if(!st)return;
    setTab('rail');setView({kind:'station',id:id});setFocusStop(null);setSelBusId(null);setFollow(false);
    setLayers(l=>l.rail?l:Object.assign({},l,{rail:true}));
    requestFit({center:{x:st.x,y:st.y}});
  };
  const onPlanSet=(k,id)=>{setPlan(p=>Object.assign({},p,{[k]:'r:'+id,sel:0}));setTab('plan');setView({kind:'list'});setFocusStop(null);toast((k==='from'?'ตั้งต้นทาง: ':'ตั้งปลายทาง: ')+rn.stations[id].name,'ok');};
  const goTab=t=>{setTab(t);setView({kind:'list'});setFocusStop(null);setSelBusId(null);setFollow(false);};
  const goList=()=>{setDraftPin(null);setView({kind:'list'});setFocusStop(null);setSelBusId(null);setFollow(false);};
  const switchTab=t=>{setTab(t);goList();};
  const onHome=()=>requestFit({bounds:bkk});
  const onReset=()=>requestFit({view:THON_VIEW});
  const focusPts=pts=>{if(pts&&pts.length)requestFit({bounds:boundsOf(pts)});};

  const selPlan=(tab==='plan'||dirOpen)&&planResults[plan.sel]?planResults[plan.sel]:null;
  const planKey=selPlan?plan.from+'>'+plan.to+'#'+plan.sel:'';
  useEffect(()=>{
    if(!selPlan)return;
    const pts=[];selPlan.legs.forEach(l=>l.ll.forEach(q=>pts.push(proj(q[0],q[1]))));
    requestFit({bounds:boundsOf(pts)});
  },[planKey]);

  const placeMe=loc=>{setUserLoc(loc);const p=proj(loc.lat,loc.lon);requestFit({center:{x:p.x,y:p.y},k:0.04});};
  const nearMe=()=>{
    if(!navigator.geolocation){toast('อุปกรณ์นี้ไม่รองรับ GPS ปักตำแหน่งของคุณบนแผนที่แทน','bad');setPicking(true);pickCb.current=placeMe;return;}
    setLocating(true);
    navigator.geolocation.getCurrentPosition(
      p=>{setLocating(false);placeMe({lat:p.coords.latitude,lon:p.coords.longitude});toast('พบตำแหน่งของคุณแล้ว','ok');},
      ()=>{setLocating(false);toast('เข้าถึง GPS ไม่ได้ในหน้านี้ แตะบนแผนที่เพื่อปักตำแหน่งของคุณแทน','bad');pickCb.current=placeMe;setPicking(true);},
      {enableHighAccuracy:true,timeout:8000,maximumAge:30000});
  };
  const pickMe=()=>{pickCb.current=placeMe;setPicking(true);toast('แตะบนแผนที่เพื่อปักตำแหน่งของคุณ');};
  const requestPick=cb=>{pickCb.current=loc=>{setDraftPin(loc);cb(loc);};setPicking(true);toast('แตะบนแผนที่เพื่อเลือกพิกัด');};
  const onMapPick=loc=>{const cb=pickCb.current;setPicking(false);pickCb.current=null;if(cb)cb(loc);};

  const logout=async()=>{await Auth.logout();setAdmin(false);toast('ออกจากระบบแอดมินแล้ว');};
  const resetData=()=>{setData(JSON.parse(JSON.stringify(SEED)));toast('คืนค่าข้อมูลตัวอย่างแล้ว','ok');};

  const tabBtn=(k,label,icon)=>html`<button key=${k} className=${'tab'+(tab===k?' on':'')} onClick=${()=>switchTab(k)} aria-pressed=${tab===k?'true':'false'}><${Icon} n=${icon} s=${16}/><span>${label}</span></button>`;

  let content;
  if(tab==='admin'){
    content=admin?html`<${AdminHome} data=${data} setData=${setData} net=${net} rn=${rn} logout=${logout} toast=${toast} requestPick=${requestPick} resetData=${resetData}/>`:html`<${AdminLogin} onDone=${()=>setAdmin(true)} toast=${toast}/>`;
  }else if(view.kind==='route'){
    content=html`<${RouteDetail} sim=${sim} rtId=${view.id} dir=${view.dir} setDir=${d=>setView(Object.assign({},view,{dir:d}))} back=${goList} favs=${favs} toggleFav=${toggleFav} alerts=${alerts} toggleAlert=${toggleAlert} focusStop=${focusStop} onStop=${focusOnStop} selBusId=${selBusId} onBus=${onBus} openStop=${openStop}/>`;
  }else if(view.kind==='line'){
    content=html`<${LineDetail} rn=${rn} lineId=${view.id} back=${goList} openStation=${openStation}/>`;
  }else if(view.kind==='station'){
    content=html`<${StationDetail} rn=${rn} net=${net} sim=${sim} id=${view.id} back=${goList} openLine=${openLine} openStation=${openStation} openStop=${openStop} onPlanSet=${onPlanSet}/>`;
  }else if(view.kind==='stop'){
    content=html`<${StopDetail} sim=${sim} stopId=${view.id} back=${goList} favs=${favs} toggleFav=${toggleFav} alerts=${alerts} toggleAlert=${toggleAlert} openRoute=${openRoute}/>`;
  }else if(tab==='routes'){
    content=html`<${RoutesTab} sim=${sim} favs=${favs} toggleFav=${toggleFav} openRoute=${openRoute} onFocusPts=${focusPts}/>`;
  }else if(tab==='stops'){
    content=html`<${StopsTab} sim=${sim} favs=${favs} toggleFav=${toggleFav} openStop=${openStop} userLoc=${userLoc} onNearMe=${nearMe} locating=${locating} pickMe=${pickMe} onFocusPts=${focusPts}/>`;
  }else if(tab==='rail'){
    content=html`<${RailTab} rn=${rn} openLine=${openLine} openStation=${openStation} onFocusPts=${focusPts}/>`;
  }else if(tab==='plan'){
    content=html`<${PlannerTab} net=${net} rn=${rn} plan=${plan} setPlan=${setPlan} results=${planResults}/>`;
  }else if(tab==='guide'){
    content=html`<${GuideTab} rn=${rn} go=${goTab}/>`;
  }else{
    content=html`<${FavsTab} sim=${sim} favs=${favs} toggleFav=${toggleFav} openRoute=${openRoute} openStop=${openStop} alerts=${alerts} setAlertMins=${setAlertMins} removeAlert=${removeAlert}/>`;
  }
  const showTabs=!(view.kind!=='list'&&tab!=='admin');
  const nsb=selBus?nextStopOf(sim,selBus):null;

  return html`<div className="shell">
    <header className="top">
      <div className="brand"><${Logo}/><div><div className="brand-name">BUS <b>TIME</b></div><div className="brand-sub">รถเมล์ · BTS · MRT · ARL เช็กเวลา เส้นทาง และตำแหน่งรถ กรุงเทพฯและปริมณฑล</div></div></div>
      <div className="grow"></div>
      <${ThemeToggle} theme=${theme} setTheme=${setTheme}/>
      <span className="chip"><i className="live-dot"></i>LIVE ${fmtClock(simT)}</span>
      <button className=${'chip'+(scale>1?' on':'')} onClick=${()=>setScale(scale===1?5:scale===5?20:1)} aria-label="ความเร็วการจำลอง" title="เร่งเวลาจำลอง">จำลอง ×${scale}</button>
      <span className=${'chip'+(admin?' admin':'')}><${Icon} n=${admin?'shield':'user'} s=${14}/>${admin?'แอดมิน':'ผู้โดยสาร'}</span>
    </header>
    <main className="main">
      <section className="panel glass" aria-label="แผงควบคุม">
        ${showTabs&&html`<div style=${{padding:'12px 14px 0'}}><nav className="tabs mnav" aria-label="เมนูหลัก">${tabBtn('routes','สายรถ','bus')}${tabBtn('stops','ป้าย','pin')}${tabBtn('rail','รถไฟฟ้า','train')}${tabBtn('plan','วางแผน','route')}${tabBtn('favs','โปรด','star')}${tabBtn('guide','คู่มือ','book')}${tabBtn('admin','แอดมิน','lock')}</nav></div>`}
        ${content}
      </section>
      <section className="map-card glass" aria-label="แผนที่">
        <${MapView} mapMode=${mapMode==='transit'?'transit':'default'} sim=${sim} rn=${rn} layers=${layers} theme=${theme} selLine=${view.kind==='line'?view.id:null} focusStation=${view.kind==='station'?view.id:null} plan=${selPlan} onStation=${openStation} onPlanSet=${onPlanSet} selRt=${selRt} selDir=${view.kind==='route'?view.dir:'out'} focusStop=${focusStop} selBus=${selBus} follow=${follow} userLoc=${userLoc}
          picking=${picking} onMapPick=${onMapPick} onStop=${id=>{ if(view.kind==='route')focusOnStop(id); else openStop(id); }} onBus=${onBus} onHome=${onHome} onReset=${onReset} onLocate=${nearMe} onUserMove=${()=>setFollow(false)} draftPin=${draftPin} fitReq=${fitReq}>
          <div className="hud tr"><${MapModes} mode=${mapMode} setMode=${setMapMode}/></div>
          <div className="hud tl" style=${{flexDirection:'column',flexWrap:'nowrap',alignItems:'flex-start'}}>
            <${MapSearch} net=${net} rn=${rn} onStation=${openStation} onStop=${openStop} onRoute=${id=>openRoute(id)} onPlan=${()=>goTab('plan')} dirOpen=${dirOpen} setDirOpen=${setDirOpen} plan=${plan} setPlan=${setPlan} results=${planResults}/>
            <div className="smart-shelter-slot"><a id="smart-shelter-link" href="./smart_bus_shelter_3d_showcase.html" target="_blank" rel="noopener noreferrer" aria-label="เปิด Smart Bus Shelter 3D Showcase"><span aria-hidden="true">🏙️</span><span>ดูป้ายรถเมล์อัจฉริยะ 3D</span><span aria-hidden="true">↗</span></a></div>
            <div className="layers" role="group" aria-label="ชั้นข้อมูลแผนที่">
              <button className=${'chip'+(layers.bus?' on':'')} aria-pressed=${layers.bus?'true':'false'} onClick=${()=>setLayers(l=>Object.assign({},l,{bus:!l.bus}))}><${Icon} n="bus" s=${14}/>รถเมล์</button>
              <button className=${'chip'+(layers.rail?' on':'')} aria-pressed=${layers.rail?'true':'false'} onClick=${()=>setLayers(l=>Object.assign({},l,{rail:!l.rail}))}><${Icon} n="train" s=${14}/>รถไฟฟ้า</button>
              <span className="mstat ok" title="แผนที่เวกเตอร์ในตัว ไม่ใช้ไทล์ภายนอก/ไม่ต้องมี API key"><i></i>แผนที่ในตัว · ออฟไลน์ได้</span>
            </div>
            ${picking&&html`<div className="pickbar">แตะบนแผนที่เพื่อเลือกตำแหน่ง<button onClick=${()=>{setPicking(false);pickCb.current=null;}}>ยกเลิก</button></div>`}
          </div>
          <div className="hud bl">
            ${view.kind==='station'&&rn.stations[view.id]&&(()=>{const st=rn.stations[view.id];return html`<${InfoSheet} key=${st.id} title=${st.name} sub=${(st.en?st.en+' · ':'')+(st.districtLabel||'รถไฟฟ้า')} onClose=${goList} startCollapsed=${typeof window!=='undefined'&&window.innerWidth<900}
              tags=${st.lines.map(l=>html`<${LTag} key=${l} ln=${rn.lineById[l]}/>`)}
              rows=${nextTrains(rn,st.id,sim.t).slice(0,3).map(x=>({tag:html`<${LTag} ln=${x.line}/>`,text:'ไป '+x.to,eta:x.min<=0?'<1 นาที':'~'+x.min+' นาที'}))}
              actions=${html`<${React.Fragment}><button className="btn sm pri" onClick=${()=>onPlanSet('from',st.id)}>ต้นทาง</button><button className="btn sm" onClick=${()=>onPlanSet('to',st.id)}>ปลายทาง</button><a className="gmap" href=${gmapsAt(st)} target="_blank" rel="noopener noreferrer">Google Maps ↗</a><//>`}/>`;})()}
            ${view.kind==='stop'&&net.stopsById[view.id]&&(()=>{const sp=net.stopsById[view.id];return html`<${InfoSheet} key=${sp.id} title=${sp.name} sub=${(sp.en?sp.en+' · ':'')+(sp.districtLabel||sp.province)} onClose=${goList} startCollapsed=${typeof window!=='undefined'&&window.innerWidth<900}
              rows=${stopArrivals(sim,sp.id).slice(0,3).map(a=>({tag:html`<${RNo} rt=${a.rt} small=${true}/>`,text:'ขา'+(a.d==='out'?'ไป':'กลับ'),eta:etaParts(a.items[0].eta,a.items[0].delta).text}))}
              actions=${html`<a className="gmap" href=${gmapsAt(sp)} target="_blank" rel="noopener noreferrer">Google Maps ↗</a>`}/>`;})()}
            ${selBus&&html`<div className="buscardmap glass">
              <div className="r1"><${RNo} rt=${selBus.rt}/><div style=${{flex:1,minWidth:0}}><b>${selBus.code}</b> <span style=${{color:'var(--muted)',fontSize:12.5}}>ทะเบียน ${selBus.plate}</span><div className="t2" style=${{fontSize:12.5,color:'var(--muted)'}}>${selBus.parked?nsb.text:'ป้ายถัดไป '+nsb.name+' · '+etaParts(nsb.eta,nsb.km).text}</div></div>
                <button className="icbtn" aria-label="ปิด" onClick=${()=>{setSelBusId(null);setFollow(false);}}><${Icon} n="close" s=${16}/></button></div>
              <div className="r2"><span>${selBus.parked?'จอดพัก':Math.round(selBus.kmh)+' กม./ชม.'}</span><${Crowd} lvl=${crowdOf(selBus,sim.t)}/>
                <button className=${'chip'+(follow?' on':'')} style=${{height:24,fontSize:12}} onClick=${()=>setFollow(!follow)}>${follow?'กำลังติดตามรถ':'ติดตามรถคันนี้'}</button></div>
            </div>`}
            ${layers.rail&&html`<div className="rlegend" aria-label="สีประจำสายรถไฟฟ้า">${rn.lines.map(l=>html`<button key=${l.id} className="lchip" style=${{'--lc':l.color}} onClick=${()=>openLine(l.id)}><i></i>${l.short}</button>`)}</div>`}
            <div className="legend"><span><i style=${{background:'var(--sky)'}}></i>รถเมล์ (วงเขียว=ว่าง เหลือง=ปานกลาง แดง=แน่น)</span><span className="keep"><button className=${'chip'+(roadsOnline?' on':'')} aria-pressed=${roadsOnline?'true':'false'} style=${{height:22,fontSize:11.5}} title="ขอแนวถนนจริงจากบริการ OSRM (ต้องออนไลน์) ค่าเริ่มต้นปิด = ไม่เรียกบริการภายนอก" onClick=${()=>setRoadsOnline(!roadsOnline)}>แนวถนนจริง (ออนไลน์): ${roadsOnline?'เปิด '+net.routes.filter(r=>r.onRoad).length+'/'+net.routes.length:'ปิด'}</button>${roadsOnline&&net.routes.some(r=>!r.onRoad)&&html` <button className="chip" style=${{height:22,fontSize:11.5}} onClick=${retryRoads}>ลองใหม่</button>`}</span><span>ข้อมูลสาย/ตำแหน่งรถเป็นตัวอย่างจำลอง · พิกัดป้ายเป็นค่าประมาณ</span></div>
          </div>
        <//>
      </section>
    </main>
    <${Toasts} items=${toasts}/>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>

</body>
</html>
